<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synthesis Control UI - 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
        }

        .visualization {
            width: 100%;
            height: 500px;
            background: #000;
            border-radius: 8px;
            margin-bottom: 40px;
            position: relative;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .controls {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .slider-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .slider-label {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
        }

        .slider-value {
            font-weight: bold;
            color: #fff;
            font-variant-numeric: tabular-nums;
        }

        .slider-container {
            position: relative;
            height: 40px;
            display: flex;
            align-items: center;
        }

        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 4px;
            background: #222;
            outline: none;
            border-radius: 2px;
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #fff;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.2);
        }

        input[type="range"]::-moz-range-thumb {
            width: 20px;
            height: 20px;
            background: #fff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s ease;
        }

        input[type="range"]::-moz-range-thumb:hover {
            transform: scale(1.2);
        }

        .slider-extremes {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #555;
            margin-top: 4px;
            padding: 0 2px;
        }

        .title {
            text-align: center;
            margin-bottom: 30px;
            font-size: 24px;
            letter-spacing: 2px;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 class="title">SYNTHESIS CONTROL - 3D</h1>

        <div class="visualization">
            <canvas id="canvas"></canvas>
        </div>

        <div class="controls">
            <div class="slider-group">
                <div class="slider-label">
                    <span>Darkness / Brightness</span>
                    <span class="slider-value" id="brightness-value">1.00</span>
                </div>
                <div class="slider-container">
                    <input type="range" id="brightness" min="0" max="1" step="0.01" value="1.0">
                </div>
                <div class="slider-extremes">
                    <span>Bright</span>
                    <span>Dark</span>
                </div>
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span>Smooth / Texture</span>
                    <span class="slider-value" id="texture-value">0.00</span>
                </div>
                <div class="slider-container">
                    <input type="range" id="texture" min="0" max="1" step="0.01" value="0.0">
                </div>
                <div class="slider-extremes">
                    <span>Textured</span>
                    <span>Smooth</span>
                </div>
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span>Thinness / Thickness</span>
                    <span class="slider-value" id="thickness-value">0.00</span>
                </div>
                <div class="slider-container">
                    <input type="range" id="thickness" min="0" max="1" step="0.01" value="0.0">
                </div>
                <div class="slider-extremes">
                    <span>Thick</span>
                    <span>Thin</span>
                </div>
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span>Stillness / Motion</span>
                    <span class="slider-value" id="motion-value">0.00</span>
                </div>
                <div class="slider-container">
                    <input type="range" id="motion" min="0" max="1" step="0.01" value="0.0">
                </div>
                <div class="slider-extremes">
                    <span>Motion</span>
                    <span>Still</span>
                </div>
            </div>

            <div class="slider-group">
                <div class="slider-label">
                    <span>Render Mode</span>
                    <span class="slider-value" id="mode-value">Line</span>
                </div>
                <div class="slider-container">
                    <select id="render-mode" style="width: 100%; height: 30px; background: #222; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 0 10px; font-size: 14px; cursor: pointer;">
                        <option value="line">Line</option>
                        <option value="sphere">Particle (Sphere)</option>
                        <option value="cube">Particle (Cube)</option>
                        <option value="surface">Surface</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';

        // Canvas setup
        const canvas = document.getElementById('canvas');
        const rect = canvas.getBoundingClientRect();
        const width = rect.width;
        const height = rect.height;

        // Three.js setup
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, width / height, 0.1, 1000);
        camera.position.z = 5;

        const renderer = new THREE.WebGLRenderer({
            canvas: canvas,
            antialias: true,
            alpha: true
        });
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.setClearColor(0x000000, 1);

        // Add lighting for surface depth
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4); // Soft ambient light
        scene.add(ambientLight);

        const directionalLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
        directionalLight1.position.set(5, 5, 5);
        scene.add(directionalLight1);

        const directionalLight2 = new THREE.DirectionalLight(0xffffff, 0.3);
        directionalLight2.position.set(-5, -5, -5);
        scene.add(directionalLight2);

        // Rim light for edge definition
        const rimLight = new THREE.DirectionalLight(0xffffff, 0.5);
        rimLight.position.set(0, 0, -10);
        scene.add(rimLight);

        // Parameters
        const params = {
            brightness: 1.0,
            texture: 0.0,
            thickness: 0.0,
            motion: 0.0,
            renderMode: 'line'
        };

        // Slider connections
        const sliders = {
            brightness: document.getElementById('brightness'),
            texture: document.getElementById('texture'),
            thickness: document.getElementById('thickness'),
            motion: document.getElementById('motion')
        };

        const valueDisplays = {
            brightness: document.getElementById('brightness-value'),
            texture: document.getElementById('texture-value'),
            thickness: document.getElementById('thickness-value'),
            motion: document.getElementById('motion-value')
        };

        // Update parameters from sliders
        Object.keys(sliders).forEach(key => {
            sliders[key].addEventListener('input', (e) => {
                params[key] = parseFloat(e.target.value);
                valueDisplays[key].textContent = params[key].toFixed(2);
            });
        });

        // Render mode selector
        const renderModeSelect = document.getElementById('render-mode');
        const modeValueDisplay = document.getElementById('mode-value');
        renderModeSelect.addEventListener('change', (e) => {
            params.renderMode = e.target.value;
            const modeNames = {
                'line': 'Line',
                'sphere': 'Sphere',
                'cube': 'Cube',
                'surface': 'Surface'
            };
            modeValueDisplay.textContent = modeNames[params.renderMode];
        });

        // Blob generation using mathematical control points
        class Blob3D {
            constructor(seed, index, maxBlobs) {
                this.seed = seed;
                this.basePoints = 8;
                this.time = 0;
                this.index = index;
                this.maxBlobs = maxBlobs;

                // Create line geometry and material
                this.lineGeometry = new THREE.BufferGeometry();
                this.lineMaterial = new THREE.LineBasicMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 1.0
                });
                this.line = new THREE.Line(this.lineGeometry, this.lineMaterial);
                scene.add(this.line);

                // Create particle group for sphere/cube mode
                this.particleGroup = new THREE.Group();
                scene.add(this.particleGroup);
                this.particles = [];
                this.particleNoiseOffsets = []; // Store base noise offsets per particle
                this.textureBlend = 0.0; // Exponential blend factor (0 = perfect sphere, 1 = full texture)

                // Create surface mesh
                this.surfaceGeometry = new THREE.BufferGeometry();
                this.surfaceMaterial = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    transparent: true,
                    opacity: 1.0,
                    side: THREE.DoubleSide,
                    wireframe: false,
                    roughness: 0.7,
                    metalness: 0.1,
                    flatShading: false
                });
                this.surfaceMesh = new THREE.Mesh(this.surfaceGeometry, this.surfaceMaterial);
                scene.add(this.surfaceMesh);

                this.currentMode = 'line';
            }

            // Get control points for 2D line (circle in XY plane)
            getControlPoints() {
                const points = [];
                const numPoints = this.basePoints + Math.floor(params.texture * 40);

                const motionAmount = 1 - params.motion;
                const rotationOffset = this.time * (1 - motionAmount) * 1.0;

                for (let i = 0; i < numPoints; i++) {
                    const angle = (i / numPoints) * Math.PI * 2 + rotationOffset;

                    const baseRadius = 1.4;

                    const textureFade = Math.pow(params.texture, 0.5);
                    const baseMotion = textureFade * (
                        Math.sin(angle * 2 + this.time * 2) * 0.15 +
                        Math.cos(angle * 3 + this.time * 1.5) * 0.10
                    );

                    const seedVal1 = Math.sin(i * 12.9898 + this.seed * 78.233) * 0.5 + 0.5;
                    const seedVal2 = Math.sin(i * 45.164 + this.seed * 32.234) * 0.5 + 0.5;
                    const seedVal3 = Math.sin(i * 91.327 + this.seed * 15.719) * 0.5 + 0.5;

                    const roughRandom = (seedVal1 + seedVal2 * 0.5 + seedVal3 * 0.3) / 1.8;
                    const randomDisplacement = roughRandom * params.texture * 1.08;

                    const radius = baseRadius + baseMotion + randomDisplacement;

                    points.push(new THREE.Vector3(
                        Math.cos(angle) * radius,
                        Math.sin(angle) * radius,
                        0
                    ));
                }

                // Close the loop
                if (points.length > 0) {
                    points.push(points[0].clone());
                }

                return points;
            }

            // Generate 3D sphere points with texture deformation
            getSpherePoints(numPoints, blendFactor) {
                const points = [];

                // Use Fibonacci sphere distribution for even point spacing
                const phi = Math.PI * (3 - Math.sqrt(5)); // Golden angle

                const motionAmount = 1 - params.motion;

                for (let i = 0; i < numPoints; i++) {
                    // Fibonacci sphere algorithm
                    const y = 1 - (i / (numPoints - 1)) * 2; // y from 1 to -1
                    const radius = Math.sqrt(1 - y * y);
                    const theta = phi * i + this.time * (1 - motionAmount) * 1.0;

                    const x = Math.cos(theta) * radius;
                    const z = Math.sin(theta) * radius;

                    // Base radius (perfect sphere)
                    const baseRadius = 1.4;

                    // Motion based deformation using spherical harmonics (scaled by blend)
                    const textureFade = Math.pow(params.texture, 0.5);
                    const baseMotion = textureFade * blendFactor * (
                        Math.sin(theta * 2 + this.time * 2) * 0.15 +
                        Math.cos(theta * 3 + this.time * 1.5) * 0.10 +
                        Math.sin(y * Math.PI + this.time * 1.8) * 0.12
                    );

                    // Texture creates random outward displacement (scaled by blend)
                    const seedVal1 = Math.sin(i * 12.9898 + this.seed * 78.233) * 0.5 + 0.5;
                    const seedVal2 = Math.sin(i * 45.164 + this.seed * 32.234) * 0.5 + 0.5;
                    const seedVal3 = Math.sin(i * 91.327 + this.seed * 15.719) * 0.5 + 0.5;

                    const roughRandom = (seedVal1 + seedVal2 * 0.5 + seedVal3 * 0.3) / 1.8;
                    const randomDisplacement = roughRandom * params.texture * 1.08 * blendFactor;

                    // Final radius with deformations
                    const finalRadius = baseRadius + baseMotion + randomDisplacement;

                    // Apply final radius to the normalized sphere position
                    points.push(new THREE.Vector3(
                        x * finalRadius,
                        y * finalRadius,
                        z * finalRadius
                    ));
                }

                return points;
            }

            createParticles(numParticles) {
                // Clear existing particles and their geometries/materials
                this.particles.forEach(particle => {
                    this.particleGroup.remove(particle);
                    if (particle.geometry) particle.geometry.dispose();
                    if (particle.material) particle.material.dispose();
                });
                this.particles = [];
                this.particleNoiseOffsets = [];

                // Create shared geometries for performance
                if (!this.sharedSphereGeometry) {
                    this.sharedSphereGeometry = new THREE.SphereGeometry(0.03, 8, 8);
                }
                if (!this.sharedCubeGeometry) {
                    this.sharedCubeGeometry = new THREE.BoxGeometry(0.05, 0.05, 0.05);
                }

                // Create new particles based on mode
                const geometry = params.renderMode === 'sphere' ?
                    this.sharedSphereGeometry : this.sharedCubeGeometry;

                for (let i = 0; i < numParticles; i++) {
                    const material = new THREE.MeshBasicMaterial({
                        color: 0xffffff,
                        transparent: true,
                        opacity: 1.0
                    });

                    const mesh = new THREE.Mesh(geometry, material);
                    this.particleGroup.add(mesh);
                    this.particles.push(mesh);

                    // Generate initial noise offset for this particle (static)
                    const noiseScale = 0.05;
                    this.particleNoiseOffsets.push({
                        x: this.noise3D(i * 0.1, this.seed, 0, 123.4) * noiseScale,
                        y: this.noise3D(i * 0.1, this.seed, 0, 456.7) * noiseScale,
                        z: this.noise3D(i * 0.1, this.seed, 0, 789.0) * noiseScale
                    });
                }
            }

            // Calculate position along path with interpolation
            getPositionOnPath(points, t) {
                if (points.length < 2) return new THREE.Vector3();

                const totalLength = points.length - 1;
                const position = t * totalLength;
                const index = Math.floor(position);
                const fraction = position - index;

                if (index >= points.length - 1) {
                    return points[points.length - 1].clone();
                }

                // Linear interpolation between points
                const p1 = points[index];
                const p2 = points[index + 1];
                return new THREE.Vector3().lerpVectors(p1, p2, fraction);
            }

            // Simple noise function for particle displacement
            noise3D(x, y, z, seed) {
                const n = Math.sin(x * 12.9898 + y * 78.233 + z * 45.164 + seed) * 43758.5453;
                return (n - Math.floor(n)) * 2 - 1; // Returns -1 to 1
            }

            updateRenderMode() {
                // Always manage visibility based on current render mode
                if (params.renderMode === 'line') {
                    if (this.currentMode !== 'line') {
                        // Switching to line mode - clean up particles
                        this.particles.forEach(particle => {
                            this.particleGroup.remove(particle);
                            if (particle.material) particle.material.dispose();
                        });
                        this.particles = [];
                        this.currentMode = 'line';
                    }
                } else if (params.renderMode === 'surface') {
                    // Surface mode
                    if (this.currentMode !== 'surface') {
                        // Switching to surface - clean up particles
                        this.particles.forEach(particle => {
                            this.particleGroup.remove(particle);
                            if (particle.material) particle.material.dispose();
                        });
                        this.particles = [];
                        this.currentMode = 'surface';
                    }
                } else {
                    // Particle mode (sphere or cube)
                    if (this.currentMode !== params.renderMode) {
                        // Mode changed - need to recreate particles with new geometry
                        this.particles.forEach(particle => {
                            this.particleGroup.remove(particle);
                            if (particle.material) particle.material.dispose();
                        });
                        this.particles = [];
                        this.currentMode = params.renderMode;
                    }
                }
            }

            update(deltaTime) {
                const motionAmount = 1 - params.motion;
                this.time += deltaTime * (1 - motionAmount) * 12.0;

                // Update render mode
                this.updateRenderMode();

                // Exponentially blend texture over time
                // Target blend is based on texture parameter
                const targetBlend = params.texture;
                const blendSpeed = 2.0; // Speed of exponential approach
                const oldBlend = this.textureBlend;
                this.textureBlend += (targetBlend - this.textureBlend) * blendSpeed * deltaTime;
                // Clamp to avoid overshoot
                this.textureBlend = Math.max(0, Math.min(1, this.textureBlend));

                if (Math.abs(targetBlend - oldBlend) > 0.01) {
                    console.log('Blend update - target:', targetBlend, 'old:', oldBlend, 'new:', this.textureBlend, 'deltaTime:', deltaTime);
                }

                // Get control points
                const points = this.getControlPoints();

                // Calculate common properties
                const brightness = params.brightness;
                const value = Math.floor(brightness * 255);
                const color = { r: value / 255, g: value / 255, b: value / 255 };

                const normalizedIndex = this.index / Math.max(1, this.maxBlobs - 1);
                const alphaThickness = 1 - params.thickness;
                const baseAlpha = alphaThickness * 0.5 + 0.15;

                const seedVariation = Math.sin(this.seed * 12.9898 + this.seed * 78.233) * 0.5 + 0.5;
                const alphaVariation = seedVariation * 0.4 + 0.6;
                const depthFalloff = 1 - (normalizedIndex * 0.3);
                const opacity = baseAlpha * alphaVariation * depthFalloff;

                // Calculate position offset (spread)
                const spreadAmount = params.thickness;
                const spreadFactor = spreadAmount * 2.0;
                const spread = Math.pow(normalizedIndex, 1.5) * spreadFactor * 0.3325;

                const rotationAngle = normalizedIndex * Math.PI * 2 * spreadFactor * 2;
                const spreadX = Math.cos(rotationAngle) * spread;
                const spreadY = Math.sin(rotationAngle) * spread;

                const scale = 1 - (normalizedIndex * 0.05);
                const motionRotation = this.time * (1 - motionAmount) * 0.5;

                if (params.renderMode === 'line') {
                    // Update line geometry
                    this.lineGeometry.setFromPoints(points);
                    this.lineMaterial.color.setRGB(color.r, color.g, color.b);
                    this.lineMaterial.opacity = opacity;

                    this.line.scale.set(scale, scale, scale);
                    this.line.rotation.z = motionRotation;
                    this.line.position.set(spreadX, spreadY, 0);

                    // Ensure correct visibility
                    this.line.visible = true;
                    this.particleGroup.visible = false;
                    this.surfaceMesh.visible = false;
                } else if (params.renderMode === 'sphere' || params.renderMode === 'cube') {
                    // 3D PARTICLE MODE - Distribute particles around a sphere
                    // Number of particles based on texture (more texture = more particles)
                    const numParticles = Math.floor(100 + params.texture * 400); // 100 to 500 particles

                    // Recreate particles if count changed significantly or mode changed
                    if (Math.abs(this.particles.length - numParticles) > 20) {
                        this.createParticles(numParticles);
                    }

                    // Get 3D sphere points with deformations (using exponential blend)
                    const spherePoints = this.getSpherePoints(this.particles.length, this.textureBlend);

                    // Position particles on the deformed sphere with blended static noise
                    this.particles.forEach((particle, i) => {
                        const basePos = spherePoints[i];
                        const noiseOffset = this.particleNoiseOffsets[i] || { x: 0, y: 0, z: 0 };

                        // Apply noise offset scaled by blend factor
                        particle.position.set(
                            basePos.x + noiseOffset.x * this.textureBlend,
                            basePos.y + noiseOffset.y * this.textureBlend,
                            basePos.z + noiseOffset.z * this.textureBlend
                        );

                        particle.material.color.setRGB(color.r, color.g, color.b);
                        particle.material.opacity = opacity;
                    });

                    this.particleGroup.scale.set(scale, scale, scale);

                    // Apply 3D rotation for motion
                    this.particleGroup.rotation.x = motionRotation * 0.3;
                    this.particleGroup.rotation.y = motionRotation * 0.5;
                    this.particleGroup.rotation.z = motionRotation;

                    this.particleGroup.position.set(spreadX, spreadY, 0);

                    // Ensure correct visibility
                    this.line.visible = false;
                    this.particleGroup.visible = true;
                    this.surfaceMesh.visible = false;
                } else if (params.renderMode === 'surface') {
                    // SURFACE MODE - Create UV sphere mesh with proper triangulation
                    const numPoints = Math.floor(100 + params.texture * 200); // 100 to 300 points

                    // Calculate UV sphere grid dimensions
                    const latSegments = Math.max(3, Math.floor(Math.sqrt(numPoints * 0.5)));
                    const lonSegments = Math.max(3, Math.floor(numPoints / latSegments));

                    const vertices = [];
                    const indices = [];

                    console.log('Surface mode - latSegments:', latSegments, 'lonSegments:', lonSegments, 'textureBlend:', this.textureBlend);

                    // Generate UV sphere points
                    for (let lat = 0; lat <= latSegments; lat++) {
                        const theta = (lat / latSegments) * Math.PI; // 0 to PI
                        const sinTheta = Math.sin(theta);
                        const cosTheta = Math.cos(theta);

                        for (let lon = 0; lon <= lonSegments; lon++) {
                            const phi = (lon / lonSegments) * Math.PI * 2; // 0 to 2PI
                            const sinPhi = Math.sin(phi);
                            const cosPhi = Math.cos(phi);

                            // Unit sphere coordinates
                            const x = cosPhi * sinTheta;
                            const y = cosTheta;
                            const z = sinPhi * sinTheta;

                            // Base radius
                            const baseRadius = 1.4;

                            // Apply deformations with blend
                            const textureFade = Math.pow(params.texture, 0.5);
                            const motionAmount = 1 - params.motion;
                            const timeOffset = this.time * (1 - motionAmount) * 1.0;

                            const baseMotion = textureFade * this.textureBlend * (
                                Math.sin(phi * 2 + this.time * 2) * 0.15 +
                                Math.cos(phi * 3 + this.time * 1.5) * 0.10 +
                                Math.sin(theta * 2 + this.time * 1.8) * 0.12
                            );

                            // Random displacement
                            const pointIndex = lat * (lonSegments + 1) + lon;
                            const seedVal1 = Math.sin(pointIndex * 12.9898 + this.seed * 78.233) * 0.5 + 0.5;
                            const seedVal2 = Math.sin(pointIndex * 45.164 + this.seed * 32.234) * 0.5 + 0.5;
                            const seedVal3 = Math.sin(pointIndex * 91.327 + this.seed * 15.719) * 0.5 + 0.5;

                            const roughRandom = (seedVal1 + seedVal2 * 0.5 + seedVal3 * 0.3) / 1.8;
                            const randomDisplacement = roughRandom * params.texture * 1.08 * this.textureBlend;

                            // Static noise offset
                            if (!this.particleNoiseOffsets[pointIndex]) {
                                const noiseScale = 0.05;
                                this.particleNoiseOffsets[pointIndex] = {
                                    x: this.noise3D(pointIndex * 0.1, this.seed, 0, 123.4) * noiseScale,
                                    y: this.noise3D(pointIndex * 0.1, this.seed, 0, 456.7) * noiseScale,
                                    z: this.noise3D(pointIndex * 0.1, this.seed, 0, 789.0) * noiseScale
                                };
                            }
                            const noiseOffset = this.particleNoiseOffsets[pointIndex];

                            const finalRadius = baseRadius + baseMotion + randomDisplacement;

                            vertices.push(
                                x * finalRadius + noiseOffset.x * this.textureBlend,
                                y * finalRadius + noiseOffset.y * this.textureBlend,
                                z * finalRadius + noiseOffset.z * this.textureBlend
                            );
                        }
                    }

                    // Generate indices for UV sphere grid
                    for (let lat = 0; lat < latSegments; lat++) {
                        for (let lon = 0; lon < lonSegments; lon++) {
                            const first = lat * (lonSegments + 1) + lon;
                            const second = first + lonSegments + 1;

                            indices.push(first, second, first + 1);
                            indices.push(second, second + 1, first + 1);
                        }
                    }

                    // Update geometry
                    console.log('Vertices count:', vertices.length, 'Indices count:', indices.length, 'Expected vertex count:', (latSegments + 1) * (lonSegments + 1) * 3);

                    // Check for issues
                    if (vertices.length === 0 || indices.length === 0) {
                        console.error('Empty geometry!');
                        return;
                    }

                    // Dispose old geometry attributes if they exist
                    if (this.surfaceGeometry.attributes.position) {
                        this.surfaceGeometry.deleteAttribute('position');
                    }
                    if (this.surfaceGeometry.index) {
                        this.surfaceGeometry.setIndex(null);
                    }

                    this.surfaceGeometry.setAttribute('position',
                        new THREE.Float32BufferAttribute(vertices, 3));
                    this.surfaceGeometry.setIndex(indices);
                    this.surfaceGeometry.computeVertexNormals();

                    // Update material
                    this.surfaceMaterial.color.setRGB(color.r, color.g, color.b);
                    this.surfaceMaterial.opacity = opacity;
                    this.surfaceMaterial.needsUpdate = true;

                    // Apply transformations
                    this.surfaceMesh.scale.set(scale, scale, scale);
                    this.surfaceMesh.rotation.x = motionRotation * 0.3;
                    this.surfaceMesh.rotation.y = motionRotation * 0.5;
                    this.surfaceMesh.rotation.z = motionRotation;
                    this.surfaceMesh.position.set(spreadX, spreadY, 0);

                    // Ensure correct visibility
                    this.line.visible = false;
                    this.particleGroup.visible = false;
                    this.surfaceMesh.visible = true;
                }
            }

            destroy() {
                // Clean up line
                scene.remove(this.line);
                if (this.lineGeometry) this.lineGeometry.dispose();
                if (this.lineMaterial) this.lineMaterial.dispose();

                // Clean up particles (materials only, geometry is shared)
                this.particles.forEach(particle => {
                    this.particleGroup.remove(particle);
                    if (particle.material) particle.material.dispose();
                });
                this.particles = [];

                // Clean up shared geometries
                if (this.sharedSphereGeometry) {
                    this.sharedSphereGeometry.dispose();
                    this.sharedSphereGeometry = null;
                }
                if (this.sharedCubeGeometry) {
                    this.sharedCubeGeometry.dispose();
                    this.sharedCubeGeometry = null;
                }

                scene.remove(this.particleGroup);

                // Clean up surface mesh
                scene.remove(this.surfaceMesh);
                if (this.surfaceGeometry) this.surfaceGeometry.dispose();
                if (this.surfaceMaterial) this.surfaceMaterial.dispose();
            }
        }

        // Instance manager for thickness
        class BlobSystem {
            constructor() {
                this.blobs = [];
                this.maxBlobs = 250;
                this.initializeBlobs();
            }

            initializeBlobs() {
                for (let i = 0; i < this.maxBlobs; i++) {
                    this.blobs.push(new Blob3D(i * 0.1, i, this.maxBlobs));
                }
            }

            update(deltaTime) {
                // Calculate how many instances to show based on thickness
                const thicknessAmount = 1 - params.thickness;
                const numInstances = Math.max(1, Math.floor(1 + (1 - thicknessAmount) * (this.maxBlobs - 1)));

                // Update visible blobs
                this.blobs.forEach((blob, i) => {
                    if (i < numInstances) {
                        blob.line.visible = true;
                        blob.particleGroup.visible = true;
                        blob.surfaceMesh.visible = true;
                        blob.update(deltaTime);
                    } else {
                        blob.line.visible = false;
                        blob.particleGroup.visible = false;
                        blob.surfaceMesh.visible = false;
                    }
                });
            }

            destroy() {
                this.blobs.forEach(blob => blob.destroy());
            }
        }

        // Animation loop
        const blobSystem = new BlobSystem();
        let lastTime = performance.now();

        function animate(currentTime) {
            const deltaTime = (currentTime - lastTime) / 1000;
            lastTime = currentTime;

            blobSystem.update(deltaTime);

            // Subtle camera rotation for particle modes to show 3D depth
            if (params.renderMode !== 'line') {
                const slowTime = currentTime * 0.0001;
                camera.position.x = Math.sin(slowTime) * 0.5;
                camera.position.y = Math.cos(slowTime * 0.7) * 0.3;
                camera.lookAt(0, 0, 0);
            } else {
                // Reset camera for line mode (2D view)
                camera.position.set(0, 0, 5);
                camera.lookAt(0, 0, 0);
            }

            renderer.render(scene, camera);

            requestAnimationFrame(animate);
        }

        // Handle window resize
        window.addEventListener('resize', () => {
            const rect = canvas.getBoundingClientRect();
            const width = rect.width;
            const height = rect.height;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);
        });

        animate(performance.now());
    </script>
</body>
</html>
