<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Commit Activity Timeline - Stream Graph</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #controls {
            background: #2a2a2a;
            padding: 20px;
            border-bottom: 2px solid #444;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        #controls h3 {
            color: #4CAF50;
            margin-right: 10px;
        }

        .granularity-btn {
            padding: 6px 12px;
            border: 2px solid #444;
            background: #2a2a2a;
            color: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .granularity-btn:hover {
            border-color: #666;
            background: #333;
        }

        .granularity-btn.active {
            background: #4CAF50;
            border-color: #4CAF50;
            color: #1a1a1a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            background: #333;
        }

        .legend-item:hover {
            background: #3a3a3a;
        }

        .legend-item.disabled {
            opacity: 0.3;
        }

        .legend-item.disabled .legend-color-box {
            background: #555 !important;
        }

        .legend-color-box {
            width: 20px;
            height: 20px;
            border-radius: 3px;
            margin-right: 8px;
        }

        .legend-item.implementation .legend-color-box {
            background: #2196F3;
        }

        .legend-item.personality .legend-color-box {
            background: #FF9800;
        }

        .legend-item.mixed .legend-color-box {
            background: #E91E63;
        }

        .legend-item.other .legend-color-box {
            background: #9C27B0;
        }

        #main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #chart-container {
            flex: 1;
            position: relative;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #sidebar {
            width: 450px;
            background: #1e1e1e;
            border-left: 2px solid #444;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }

        #sidebar.active {
            display: block;
        }

        #sidebar h2 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 24px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        #sidebar .period-info {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        #sidebar .commit-count {
            color: #4CAF50;
            font-size: 18px;
            font-weight: bold;
        }

        .category-header {
            background: #333;
            padding: 8px 12px;
            border-radius: 4px;
            margin: 15px 0 10px 0;
            font-weight: bold;
            font-size: 14px;
        }

        .category-header.implementation {
            color: #2196F3;
            border-left: 3px solid #2196F3;
        }

        .category-header.personality {
            color: #FF9800;
            border-left: 3px solid #FF9800;
        }

        .category-header.mixed {
            color: #E91E63;
            border-left: 3px solid #E91E63;
        }

        .category-header.other {
            color: #9C27B0;
            border-left: 3px solid #9C27B0;
        }

        .commit-item {
            background: #333;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 3px solid #4CAF50;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .commit-item.implementation {
            border-left-color: #2196F3;
        }

        .commit-item.personality {
            border-left-color: #FF9800;
        }

        .commit-item.mixed {
            border-left-color: #E91E63;
        }

        .commit-item.other {
            border-left-color: #9C27B0;
        }

        .commit-item:hover {
            transform: translateX(5px);
            background: #3a3a3a;
        }

        .commit-hash {
            color: #888;
            font-family: monospace;
            font-size: 12px;
        }

        .commit-date {
            color: #999;
            font-size: 13px;
            margin-top: 4px;
        }

        .commit-author {
            color: #4CAF50;
            font-size: 13px;
        }

        .commit-subject {
            color: #e0e0e0;
            margin-top: 8px;
            line-height: 1.4;
        }

        .commit-type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 8px;
        }

        .commit-type-badge.implementation {
            background: #2196F320;
            color: #2196F3;
            border: 1px solid #2196F3;
        }

        .commit-type-badge.personality {
            background: #FF980020;
            color: #FF9800;
            border: 1px solid #FF9800;
        }

        .commit-type-badge.mixed {
            background: #E91E6320;
            color: #E91E63;
            border: 1px solid #E91E63;
        }

        .commit-type-badge.other {
            background: #9C27B020;
            color: #9C27B0;
            border: 1px solid #9C27B0;
        }

        .commit-files {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #444;
        }

        .commit-file {
            color: #777;
            font-size: 11px;
            font-family: monospace;
            padding: 2px 0;
        }

        #close-sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #444;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            z-index: 100;
        }

        #close-sidebar:hover {
            background: #555;
        }

        #header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        #header h1 {
            color: #4CAF50;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #header p {
            color: #888;
            margin-top: 5px;
        }

        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 13px;
            z-index: 10;
        }

        #stats .stat-label {
            color: #888;
        }

        #stats .stat-value {
            color: #4CAF50;
            font-weight: bold;
            font-size: 16px;
        }

        .axis {
            color: #888;
        }

        .axis line,
        .axis path {
            stroke: #444;
        }

        .axis text {
            fill: #888;
            font-size: 12px;
        }

        .grid line {
            stroke: #333;
            stroke-dasharray: 2,2;
        }

        .stack-layer {
            cursor: pointer;
            transition: opacity 0.3s, filter 0.3s;
            opacity: 0.8;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
        }

        .stack-layer:hover {
            opacity: 1;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
        }

        .stack-layer.implementation {
            fill: #2196F3;
        }

        .stack-layer.personality {
            fill: #FF9800;
        }

        .stack-layer.mixed {
            fill: #E91E63;
        }

        .stack-layer.other {
            fill: #9C27B0;
        }

        .total-line {
            fill: none;
            stroke: #4CAF50;
            stroke-width: 2px;
            opacity: 0.6;
        }

        .tooltip {
            position: absolute;
            background: rgba(30, 30, 30, 0.95);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #4CAF50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 13px;
            z-index: 100;
        }

        .tooltip.visible {
            opacity: 1;
        }

        .tooltip-date {
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .tooltip-total {
            color: #e0e0e0;
            margin-bottom: 5px;
        }

        .tooltip-breakdown {
            font-size: 11px;
            margin-top: 5px;
            padding-top: 5px;
            border-top: 1px solid #444;
        }

        .tooltip-cat {
            margin: 2px 0;
        }

        .tooltip-cat.implementation {
            color: #2196F3;
        }

        .tooltip-cat.personality {
            color: #FF9800;
        }

        .tooltip-cat.mixed {
            color: #E91E63;
        }

        .tooltip-cat.other {
            color: #9C27B0;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <h3>Group By:</h3>
            <button class="granularity-btn" data-granularity="day">Day</button>
            <button class="granularity-btn active" data-granularity="week">Week</button>
            <button class="granularity-btn" data-granularity="month">Month</button>

            <div style="display: flex; gap: 10px; margin-left: 30px; padding-left: 30px; border-left: 1px solid #444;">
                <h3>Legend:</h3>
                <div class="legend-item implementation">
                    <div class="legend-color-box"></div>
                    <span>Implementation</span>
                </div>
                <div class="legend-item personality">
                    <div class="legend-color-box"></div>
                    <span>Personality</span>
                </div>
                <div class="legend-item mixed">
                    <div class="legend-color-box"></div>
                    <span>Mixed</span>
                </div>
                <div class="legend-item other">
                    <div class="legend-color-box"></div>
                    <span>Other</span>
                </div>
            </div>
        </div>

        <div id="main-content">
            <div id="chart-container">
                <div id="header">
                    <h1>Stream Graph: Commit Flow</h1>
                    <p>Flowing visualization of commit activity patterns - click any stream to explore</p>
                </div>

                <div id="stats">
                    <div><span class="stat-label">Total Commits:</span> <span class="stat-value" id="total-commits">0</span></div>
                    <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #444;">
                        <div style="font-size: 12px; color: #888; margin-bottom: 5px;">By Type:</div>
                        <div style="font-size: 11px;"><span style="color: #2196F3;">■</span> Implementation: <span id="stat-implementation">0</span></div>
                        <div style="font-size: 11px;"><span style="color: #FF9800;">■</span> Personality: <span id="stat-personality">0</span></div>
                        <div style="font-size: 11px;"><span style="color: #E91E63;">■</span> Mixed: <span id="stat-mixed">0</span></div>
                        <div style="font-size: 11px;"><span style="color: #9C27B0;">■</span> Other: <span id="stat-other">0</span></div>
                    </div>
                    <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #444;">
                        <div style="font-size: 12px; color: #888; margin-bottom: 5px;">Peak Total:</div>
                        <div style="font-size: 11px;" id="peak-activity">-</div>
                    </div>
                </div>

                <svg id="timeline-chart"></svg>
                <div class="tooltip"></div>
            </div>

            <div id="sidebar">
                <button id="close-sidebar">✕ Close</button>
                <div id="sidebar-content"></div>
            </div>
        </div>
    </div>

    <script>
        let data = null;
        let allCommits = [];
        let currentGranularity = 'week';
        let selectedPeriod = null;
        let selectedCategory = null;
        let visibleCategories = {
            implementation: true,
            personality: true,
            mixed: true,
            other: true
        };

        // Load and process data
        d3.json('output/commits_data.json').then(function(loadedData) {
            data = loadedData;

            // Extract all commits
            Object.values(data.commits).forEach(commitList => {
                commitList.forEach(commit => {
                    if (!allCommits.find(c => c.hash === commit.hash)) {
                        allCommits.push({
                            ...commit,
                            datetime: new Date(commit.datetime)
                        });
                    }
                });
            });

            // Sort by date
            allCommits.sort((a, b) => a.datetime - b.datetime);

            // Calculate stats
            const commitTypes = { implementation: 0, personality: 0, mixed: 0, other: 0 };
            allCommits.forEach(commit => {
                if (commit.type in commitTypes) {
                    commitTypes[commit.type]++;
                }
            });

            document.getElementById('total-commits').textContent = allCommits.length;
            document.getElementById('stat-implementation').textContent = commitTypes.implementation;
            document.getElementById('stat-personality').textContent = commitTypes.personality;
            document.getElementById('stat-mixed').textContent = commitTypes.mixed;
            document.getElementById('stat-other').textContent = commitTypes.other;

            // Initial render
            updateVisualization();
        });

        // Set up granularity buttons
        document.querySelectorAll('.granularity-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.granularity-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentGranularity = this.dataset.granularity;
                updateVisualization();
            });
        });

        // Set up legend toggle buttons
        document.querySelectorAll('.legend-item').forEach(item => {
            const category = item.classList[1]; // Get category class (implementation, personality, etc.)
            item.addEventListener('click', function() {
                visibleCategories[category] = !visibleCategories[category];
                this.classList.toggle('disabled', !visibleCategories[category]);
                updateVisualization();
            });
        });

        function groupCommitsByPeriod(commits, granularity) {
            const groups = new Map();

            commits.forEach(commit => {
                let key;
                const date = new Date(commit.datetime);

                if (granularity === 'day') {
                    key = d3.timeDay.floor(date).getTime();
                } else if (granularity === 'week') {
                    key = d3.timeWeek.floor(date).getTime();
                } else if (granularity === 'month') {
                    key = d3.timeMonth.floor(date).getTime();
                }

                if (!groups.has(key)) {
                    groups.set(key, {
                        implementation: [],
                        personality: [],
                        mixed: [],
                        other: []
                    });
                }

                const type = commit.type || 'other';
                groups.get(key)[type].push(commit);
            });

            return Array.from(groups.entries()).map(([timestamp, categoryCommits]) => ({
                date: new Date(timestamp),
                implementation: categoryCommits.implementation.length,
                personality: categoryCommits.personality.length,
                mixed: categoryCommits.mixed.length,
                other: categoryCommits.other.length,
                commits: {
                    implementation: categoryCommits.implementation,
                    personality: categoryCommits.personality,
                    mixed: categoryCommits.mixed,
                    other: categoryCommits.other
                },
                total: categoryCommits.implementation.length +
                       categoryCommits.personality.length +
                       categoryCommits.mixed.length +
                       categoryCommits.other.length
            })).sort((a, b) => a.date - b.date);
        }

        function updateVisualization() {
            const groupedData = groupCommitsByPeriod(allCommits, currentGranularity);

            // Find peak activity
            if (groupedData.length > 0) {
                const peak = groupedData.reduce((max, d) => d.total > max.total ? d : max);
                const periodLabel = currentGranularity === 'day' ? 'Day' :
                                  currentGranularity === 'week' ? 'Week' : 'Month';
                document.getElementById('peak-activity').textContent =
                    `${peak.total} commits (${periodLabel} of ${peak.date.toLocaleDateString()})`;
            }

            drawChart(groupedData);
        }

        function drawChart(data) {
            const sidebarActive = document.getElementById('sidebar').classList.contains('active');
            const width = window.innerWidth - (sidebarActive ? 450 : 0);
            const height = window.innerHeight - 80;
            const margin = { top: 100, right: 80, bottom: 60, left: 60 };
            const chartWidth = width - margin.left - margin.right;
            const chartHeight = height - margin.top - margin.bottom;

            const svg = d3.select('#timeline-chart')
                .attr('width', width)
                .attr('height', height);

            svg.selectAll('*').remove();

            if (data.length === 0) {
                svg.append('text')
                    .attr('x', width / 2)
                    .attr('y', height / 2)
                    .attr('text-anchor', 'middle')
                    .attr('fill', '#888')
                    .attr('font-size', '18px')
                    .text('No commits found');
                return;
            }

            const g = svg.append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            // Scales
            const xScale = d3.scaleTime()
                .domain(d3.extent(data, d => d.date))
                .range([0, chartWidth]);

            // Create stack with only visible categories
            const allCategories = ['other', 'mixed', 'personality', 'implementation'];
            const categories = allCategories.filter(cat => visibleCategories[cat]);
            
            // Use different offset based on number of visible categories
            // Keep consistent order to prevent flipping when toggling
            const stack = d3.stack()
                .keys(categories)
                .order(d3.stackOrderNone) // Fixed order instead of InsideOut
                .offset(categories.length === 1 ? d3.stackOffsetSilhouette : d3.stackOffsetWiggle);

            const stackedData = stack(data);
            
            // Calculate y domain from stacked data extent  
            const yExtent = d3.extent(stackedData.flat().flat());
            const yScale = d3.scaleLinear()
                .domain(yExtent)
                .nice()
                .range([chartHeight, 0]);

            // Grid
            g.append('g')
                .attr('class', 'grid')
                .call(d3.axisLeft(yScale)
                    .tickSize(-chartWidth)
                    .tickFormat(''));

            // Create area generator
            const area = d3.area()
                .x(d => xScale(d.data.date))
                .y0(d => yScale(d[0]))
                .y1(d => yScale(d[1]))
                .curve(d3.curveBasisOpen);

            const tooltip = d3.select('.tooltip');

            // Draw stacked areas
            g.selectAll('.stack-layer')
                .data(stackedData)
                .enter()
                .append('path')
                .attr('class', d => `stack-layer ${d.key}`)
                .attr('d', area)
                .style('display', d => visibleCategories[d.key] ? 'block' : 'none')
                .on('mousemove', function(event, d) {
                    // Find closest data point
                    const [mouseX] = d3.pointer(event);
                    const xDate = xScale.invert(mouseX);
                    const bisect = d3.bisector(p => p.data.date).left;
                    const idx = bisect(d, xDate);
                    const closestData = d[idx] || d[d.length - 1];

                    if (closestData) {
                        const periodLabel = currentGranularity === 'day' ? 'Day' :
                                          currentGranularity === 'week' ? 'Week' : 'Month';

                        tooltip.html(`
                            <div class="tooltip-date">${periodLabel} of ${closestData.data.date.toLocaleDateString()}</div>
                            <div class="tooltip-total">Total: ${closestData.data.total} commits</div>
                            <div class="tooltip-breakdown">
                                ${closestData.data.implementation > 0 ? `<div class="tooltip-cat implementation">Implementation: ${closestData.data.implementation}</div>` : ''}
                                ${closestData.data.personality > 0 ? `<div class="tooltip-cat personality">Personality: ${closestData.data.personality}</div>` : ''}
                                ${closestData.data.mixed > 0 ? `<div class="tooltip-cat mixed">Mixed: ${closestData.data.mixed}</div>` : ''}
                                ${closestData.data.other > 0 ? `<div class="tooltip-cat other">Other: ${closestData.data.other}</div>` : ''}
                            </div>
                        `)
                        .style('left', (event.pageX + 10) + 'px')
                        .style('top', (event.pageY - 30) + 'px')
                        .classed('visible', true);
                    }
                })
                .on('mouseout', function() {
                    tooltip.classed('visible', false);
                })
                .on('click', function(event, d) {
                    // Find closest data point
                    const [mouseX] = d3.pointer(event);
                    const xDate = xScale.invert(mouseX);
                    const bisect = d3.bisector(p => p.data.date).left;
                    const idx = bisect(d, xDate);
                    const closestData = d[idx] || d[d.length - 1];

                    if (closestData) {
                        selectedPeriod = closestData.data;
                        selectedCategory = d.key;
                        showCommits(closestData.data, d.key);
                    }
                });

            // Axes
            const xAxis = d3.axisBottom(xScale)
                .ticks(d3.timeMonth.every(1))
                .tickFormat(d3.timeFormat('%b %Y'));

            g.append('g')
                .attr('class', 'axis')
                .attr('transform', `translate(0,${chartHeight})`)
                .call(xAxis)
                .selectAll('text')
                .attr('transform', 'rotate(-45)')
                .style('text-anchor', 'end');

            // Hide Y-axis for stream graph (wiggle offset creates meaningless negative positions)
            // g.append('g')
            //     .attr('class', 'axis')
            //     .call(d3.axisLeft(yScale).ticks(5));

            // Y-axis label (hide for stream graph)
            // g.append('text')
            //     .attr('transform', 'rotate(-90)')
            //     .attr('y', -45)
            //     .attr('x', -chartHeight / 2)
            //     .attr('text-anchor', 'middle')
            //     .attr('fill', '#888')
            //     .attr('font-size', '14px')
            //     .text('Number of Commits');

        }

        function showCommits(period, category) {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('sidebar-content');

            const periodLabel = currentGranularity === 'day' ? 'Day' :
                              currentGranularity === 'week' ? 'Week' : 'Month';

            // Get commits from this period and category
            const commits = period.commits[category] || [];

            let html = `
                <div class="period-info">
                    <h2>${periodLabel} of ${period.date.toLocaleDateString()}</h2>
                    <div class="commit-count" style="margin-top: 10px;">
                        Total: ${period.total} commits
                    </div>
                    <div style="color: #888; font-size: 13px; margin-top: 5px;">
                        ${category}: ${commits.length} commit${commits.length !== 1 ? 's' : ''}
                    </div>
                </div>
            `;

            // Sort commits by date (newest first)
            const sortedCommits = [...commits].sort((a, b) =>
                b.datetime - a.datetime
            );

            if (sortedCommits.length > 0) {
                html += `<div class="category-header ${category}">${category.toUpperCase()}</div>`;

                sortedCommits.forEach(commit => {
                    const typeLabel = commit.type || 'other';
                    html += `
                        <div class="commit-item ${typeLabel}">
                            <div class="commit-hash">${commit.hash}<span class="commit-type-badge ${typeLabel}">${typeLabel}</span></div>
                            <div class="commit-date">${commit.date} • <span class="commit-author">${commit.author}</span></div>
                            <div class="commit-subject">${commit.subject}</div>
                            ${commit.files && commit.files.length > 0 ? `
                                <div class="commit-files">
                                    ${commit.files.slice(0, 5).map(f => `<div class="commit-file">${f}</div>`).join('')}
                                    ${commit.files.length > 5 ? `<div class="commit-file">... and ${commit.files.length - 5} more</div>` : ''}
                                </div>
                            ` : ''}
                        </div>
                    `;
                });
            }

            content.innerHTML = html;
            sidebar.classList.add('active');
            updateVisualization();
        }

        document.getElementById('close-sidebar').addEventListener('click', function() {
            document.getElementById('sidebar').classList.remove('active');
            selectedPeriod = null;
            selectedCategory = null;
            updateVisualization();
        });

        window.addEventListener('resize', () => {
            updateVisualization();
        });
    </script>
</body>
</html>
