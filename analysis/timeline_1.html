<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Commit Activity Timeline</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #controls {
            background: #2a2a2a;
            padding: 20px;
            border-bottom: 2px solid #444;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        #controls h3 {
            color: #4CAF50;
            margin-right: 10px;
        }

        .filter-btn {
            padding: 8px 16px;
            border: 2px solid #444;
            background: #2a2a2a;
            color: #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
        }

        .filter-btn:hover {
            border-color: #666;
            background: #333;
        }

        .filter-btn.active {
            background: #4CAF50;
            border-color: #4CAF50;
            color: #1a1a1a;
        }

        .filter-btn.implementation.active {
            background: #2196F3;
            border-color: #2196F3;
        }

        .filter-btn.personality.active {
            background: #FF9800;
            border-color: #FF9800;
        }

        .filter-btn.other.active {
            background: #9C27B0;
            border-color: #9C27B0;
        }

        .granularity-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            margin-left: 30px;
            padding-left: 30px;
            border-left: 1px solid #444;
        }

        .granularity-btn {
            padding: 6px 12px;
            border: 2px solid #444;
            background: #2a2a2a;
            color: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .granularity-btn:hover {
            border-color: #666;
            background: #333;
        }

        .granularity-btn.active {
            background: #4CAF50;
            border-color: #4CAF50;
            color: #1a1a1a;
        }

        #main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #chart-container {
            flex: 1;
            position: relative;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        #sidebar {
            width: 450px;
            background: #1e1e1e;
            border-left: 2px solid #444;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }

        #sidebar.active {
            display: block;
        }

        #sidebar h2 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 24px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        #sidebar .period-info {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        #sidebar .commit-count {
            color: #4CAF50;
            font-size: 18px;
            font-weight: bold;
        }

        .commit-item {
            background: #333;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 3px solid #4CAF50;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .commit-item.implementation {
            border-left-color: #2196F3;
        }

        .commit-item.personality {
            border-left-color: #FF9800;
        }

        .commit-item.other {
            border-left-color: #9C27B0;
        }

        .commit-item:hover {
            transform: translateX(5px);
            background: #3a3a3a;
        }

        .commit-hash {
            color: #888;
            font-family: monospace;
            font-size: 12px;
        }

        .commit-date {
            color: #999;
            font-size: 13px;
            margin-top: 4px;
        }

        .commit-author {
            color: #4CAF50;
            font-size: 13px;
        }

        .commit-subject {
            color: #e0e0e0;
            margin-top: 8px;
            line-height: 1.4;
        }

        .commit-type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 8px;
        }

        .commit-type-badge.implementation {
            background: #2196F320;
            color: #2196F3;
            border: 1px solid #2196F3;
        }

        .commit-type-badge.personality {
            background: #FF980020;
            color: #FF9800;
            border: 1px solid #FF9800;
        }

        .commit-type-badge.other {
            background: #9C27B020;
            color: #9C27B0;
            border: 1px solid #9C27B0;
        }

        .commit-files {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid #444;
        }

        .commit-file {
            color: #777;
            font-size: 11px;
            font-family: monospace;
            padding: 2px 0;
        }

        #close-sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #444;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            z-index: 100;
        }

        #close-sidebar:hover {
            background: #555;
        }

        #header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }

        #header h1 {
            color: #4CAF50;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #header p {
            color: #888;
            margin-top: 5px;
        }

        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 13px;
            z-index: 10;
        }

        #stats .stat-label {
            color: #888;
        }

        #stats .stat-value {
            color: #4CAF50;
            font-weight: bold;
            font-size: 16px;
        }

        .axis {
            color: #888;
        }

        .axis line,
        .axis path {
            stroke: #444;
        }

        .axis text {
            fill: #888;
            font-size: 12px;
        }

        .grid line {
            stroke: #333;
            stroke-dasharray: 2,2;
        }

        .area-chart {
            fill: #4CAF5030;
            stroke: #4CAF50;
            stroke-width: 2px;
        }

        .area-chart.implementation {
            fill: #2196F330;
            stroke: #2196F3;
        }

        .area-chart.personality {
            fill: #FF980030;
            stroke: #FF9800;
        }

        .area-chart.other {
            fill: #9C27B030;
            stroke: #9C27B0;
        }

        .data-point {
            fill: #4CAF50;
            stroke: #1a1a1a;
            stroke-width: 2px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .data-point.implementation {
            fill: #2196F3;
        }

        .data-point.personality {
            fill: #FF9800;
        }

        .data-point.other {
            fill: #9C27B0;
        }

        .data-point:hover {
            r: 8;
            filter: brightness(1.4);
        }

        .data-point.selected {
            r: 8;
            filter: brightness(1.5) drop-shadow(0 0 10px currentColor);
        }

        .tooltip {
            position: absolute;
            background: rgba(30, 30, 30, 0.95);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #4CAF50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 13px;
            z-index: 100;
        }

        .tooltip.visible {
            opacity: 1;
        }

        .tooltip-date {
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .tooltip-count {
            color: #e0e0e0;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <h3>Filter:</h3>
            <button class="filter-btn all active" data-filter="all">All</button>
            <button class="filter-btn implementation" data-filter="implementation">Implementation</button>
            <button class="filter-btn personality" data-filter="personality">Personality</button>
            <button class="filter-btn other" data-filter="other">Other</button>

            <div class="granularity-controls">
                <h3>Group By:</h3>
                <button class="granularity-btn" data-granularity="day">Day</button>
                <button class="granularity-btn active" data-granularity="week">Week</button>
                <button class="granularity-btn" data-granularity="month">Month</button>
            </div>
        </div>

        <div id="main-content">
            <div id="chart-container">
                <div id="header">
                    <h1>Commit Activity Timeline</h1>
                    <p>Click on any point to see commits for that period</p>
                </div>

                <div id="stats">
                    <div><span class="stat-label">Total Commits:</span> <span class="stat-value" id="total-commits">0</span></div>
                    <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #444;">
                        <div style="font-size: 12px; color: #888; margin-bottom: 5px;">By Type:</div>
                        <div style="font-size: 11px;"><span style="color: #2196F3;">■</span> Implementation: <span id="stat-implementation">0</span></div>
                        <div style="font-size: 11px;"><span style="color: #FF9800;">■</span> Personality: <span id="stat-personality">0</span></div>
                        <div style="font-size: 11px;"><span style="color: #9C27B0;">■</span> Other: <span id="stat-other">0</span></div>
                    </div>
                    <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #444;">
                        <div style="font-size: 12px; color: #888; margin-bottom: 5px;">Peak Activity:</div>
                        <div style="font-size: 11px;" id="peak-activity">-</div>
                    </div>
                </div>

                <svg id="timeline-chart"></svg>
                <div class="tooltip"></div>
            </div>

            <div id="sidebar">
                <button id="close-sidebar">✕ Close</button>
                <div id="sidebar-content"></div>
            </div>
        </div>
    </div>

    <script>
        let data = null;
        let allCommits = [];
        let currentFilter = 'all';
        let currentGranularity = 'week';
        let selectedPeriod = null;

        // Load and process data
        d3.json('commits_data.json').then(function(loadedData) {
            data = loadedData;

            // Extract all commits
            Object.values(data.commits).forEach(commitList => {
                commitList.forEach(commit => {
                    if (!allCommits.find(c => c.hash === commit.hash)) {
                        allCommits.push({
                            ...commit,
                            datetime: new Date(commit.datetime)
                        });
                    }
                });
            });

            // Sort by date
            allCommits.sort((a, b) => a.datetime - b.datetime);

            // Calculate stats
            const commitTypes = { implementation: 0, personality: 0, other: 0 };
            allCommits.forEach(commit => {
                if (commit.type in commitTypes) {
                    commitTypes[commit.type]++;
                }
            });

            document.getElementById('total-commits').textContent = allCommits.length;
            document.getElementById('stat-implementation').textContent = commitTypes.implementation;
            document.getElementById('stat-personality').textContent = commitTypes.personality;
            document.getElementById('stat-other').textContent = commitTypes.other;

            // Initial render
            updateVisualization();
        });

        // Set up filter buttons
        document.querySelectorAll('.filter-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentFilter = this.dataset.filter;
                updateVisualization();
            });
        });

        // Set up granularity buttons
        document.querySelectorAll('.granularity-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.granularity-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentGranularity = this.dataset.granularity;
                updateVisualization();
            });
        });

        function groupCommitsByPeriod(commits, granularity) {
            const groups = new Map();

            commits.forEach(commit => {
                let key;
                const date = new Date(commit.datetime);

                if (granularity === 'day') {
                    key = d3.timeDay.floor(date).getTime();
                } else if (granularity === 'week') {
                    key = d3.timeWeek.floor(date).getTime();
                } else if (granularity === 'month') {
                    key = d3.timeMonth.floor(date).getTime();
                }

                if (!groups.has(key)) {
                    groups.set(key, []);
                }
                groups.get(key).push(commit);
            });

            return Array.from(groups.entries()).map(([timestamp, commits]) => ({
                date: new Date(timestamp),
                commits: commits,
                count: commits.length
            })).sort((a, b) => a.date - b.date);
        }

        function updateVisualization() {
            // Filter commits
            const filteredCommits = currentFilter === 'all'
                ? allCommits
                : allCommits.filter(c => c.type === currentFilter);

            // Group by period
            const groupedData = groupCommitsByPeriod(filteredCommits, currentGranularity);

            // Find peak activity
            if (groupedData.length > 0) {
                const peak = groupedData.reduce((max, d) => d.count > max.count ? d : max);
                const periodLabel = currentGranularity === 'day' ? 'Day' :
                                  currentGranularity === 'week' ? 'Week' : 'Month';
                document.getElementById('peak-activity').textContent =
                    `${peak.count} commits (${periodLabel} of ${peak.date.toLocaleDateString()})`;
            }

            drawChart(groupedData);
        }

        function drawChart(data) {
            const sidebarActive = document.getElementById('sidebar').classList.contains('active');
            const width = window.innerWidth - (sidebarActive ? 450 : 0);
            const height = window.innerHeight - 80;
            const margin = { top: 100, right: 80, bottom: 60, left: 60 };
            const chartWidth = width - margin.left - margin.right;
            const chartHeight = height - margin.top - margin.bottom;

            const svg = d3.select('#timeline-chart')
                .attr('width', width)
                .attr('height', height);

            svg.selectAll('*').remove();

            if (data.length === 0) {
                svg.append('text')
                    .attr('x', width / 2)
                    .attr('y', height / 2)
                    .attr('text-anchor', 'middle')
                    .attr('fill', '#888')
                    .attr('font-size', '18px')
                    .text('No commits found for selected filter');
                return;
            }

            const g = svg.append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            // Scales
            const xScale = d3.scaleTime()
                .domain(d3.extent(data, d => d.date))
                .range([0, chartWidth]);

            const yScale = d3.scaleLinear()
                .domain([0, d3.max(data, d => d.count)])
                .nice()
                .range([chartHeight, 0]);

            // Grid
            g.append('g')
                .attr('class', 'grid')
                .call(d3.axisLeft(yScale)
                    .tickSize(-chartWidth)
                    .tickFormat(''));

            // Area
            const area = d3.area()
                .x(d => xScale(d.date))
                .y0(chartHeight)
                .y1(d => yScale(d.count))
                .curve(d3.curveMonotoneX);

            const areaClass = currentFilter === 'all' ? '' : currentFilter;
            g.append('path')
                .datum(data)
                .attr('class', `area-chart ${areaClass}`)
                .attr('d', area);

            // Axes
            const xAxis = d3.axisBottom(xScale)
                .ticks(d3.timeMonth.every(1))
                .tickFormat(d3.timeFormat('%b %Y'));

            g.append('g')
                .attr('class', 'axis')
                .attr('transform', `translate(0,${chartHeight})`)
                .call(xAxis)
                .selectAll('text')
                .attr('transform', 'rotate(-45)')
                .style('text-anchor', 'end');

            g.append('g')
                .attr('class', 'axis')
                .call(d3.axisLeft(yScale).ticks(5));

            // Y-axis label
            g.append('text')
                .attr('transform', 'rotate(-90)')
                .attr('y', -45)
                .attr('x', -chartHeight / 2)
                .attr('text-anchor', 'middle')
                .attr('fill', '#888')
                .attr('font-size', '14px')
                .text('Number of Commits');

            // Data points
            const pointClass = currentFilter === 'all' ? '' : currentFilter;
            const tooltip = d3.select('.tooltip');

            g.selectAll('.data-point')
                .data(data)
                .enter()
                .append('circle')
                .attr('class', `data-point ${pointClass}`)
                .attr('cx', d => xScale(d.date))
                .attr('cy', d => yScale(d.count))
                .attr('r', 5)
                .on('mouseover', function(event, d) {
                    const periodLabel = currentGranularity === 'day' ? 'Day' :
                                      currentGranularity === 'week' ? 'Week' : 'Month';
                    tooltip
                        .html(`
                            <div class="tooltip-date">${periodLabel} of ${d.date.toLocaleDateString()}</div>
                            <div class="tooltip-count">${d.count} commit${d.count !== 1 ? 's' : ''}</div>
                        `)
                        .style('left', (event.pageX + 10) + 'px')
                        .style('top', (event.pageY - 30) + 'px')
                        .classed('visible', true);
                })
                .on('mouseout', function() {
                    tooltip.classed('visible', false);
                })
                .on('click', function(event, d) {
                    d3.selectAll('.data-point').classed('selected', false);
                    d3.select(this).classed('selected', true);
                    selectedPeriod = d;
                    showCommits(d);
                });
        }

        function showCommits(period) {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('sidebar-content');

            const periodLabel = currentGranularity === 'day' ? 'Day' :
                              currentGranularity === 'week' ? 'Week' : 'Month';

            let html = `
                <div class="period-info">
                    <h2>${periodLabel} of ${period.date.toLocaleDateString()}</h2>
                    <div class="commit-count" style="margin-top: 10px;">
                        ${period.count} commit${period.count !== 1 ? 's' : ''}
                    </div>
                </div>
            `;

            // Sort commits by date (newest first)
            const sortedCommits = [...period.commits].sort((a, b) =>
                b.datetime - a.datetime
            );

            sortedCommits.forEach(commit => {
                const typeLabel = commit.type || 'other';
                html += `
                    <div class="commit-item ${typeLabel}">
                        <div class="commit-hash">${commit.hash}<span class="commit-type-badge ${typeLabel}">${typeLabel}</span></div>
                        <div class="commit-date">${commit.date} • <span class="commit-author">${commit.author}</span></div>
                        <div class="commit-subject">${commit.subject}</div>
                        ${commit.files && commit.files.length > 0 ? `
                            <div class="commit-files">
                                ${commit.files.slice(0, 5).map(f => `<div class="commit-file">${f}</div>`).join('')}
                                ${commit.files.length > 5 ? `<div class="commit-file">... and ${commit.files.length - 5} more</div>` : ''}
                            </div>
                        ` : ''}
                    </div>
                `;
            });

            content.innerHTML = html;
            sidebar.classList.add('active');
            updateVisualization();
        }

        document.getElementById('close-sidebar').addEventListener('click', function() {
            document.getElementById('sidebar').classList.remove('active');
            selectedPeriod = null;
            d3.selectAll('.data-point').classed('selected', false);
            updateVisualization();
        });

        window.addEventListener('resize', () => {
            updateVisualization();
        });
    </script>
</body>
</html>
