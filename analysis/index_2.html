<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Commit Word Cloud Explorer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/compromise@14.9.0/builds/compromise.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }
        
        #container {
            display: flex;
            height: 100vh;
        }
        
        #cloud-container {
            flex: 1;
            position: relative;
            background: #2a2a2a;
        }
        
        #sidebar {
            width: 400px;
            background: #1e1e1e;
            border-left: 2px solid #444;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }
        
        #sidebar.active {
            display: block;
        }
        
        #sidebar h2 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 24px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        
        #sidebar .word-info {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        #sidebar .commit-count {
            color: #4CAF50;
            font-size: 18px;
            font-weight: bold;
        }
        
        #sidebar .word-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-top: 8px;
            font-weight: bold;
        }
        
        .commit-item {
            background: #333;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 3px solid #4CAF50;
            transition: transform 0.2s;
        }
        
        .commit-item:hover {
            transform: translateX(5px);
            background: #3a3a3a;
        }
        
        .commit-hash {
            color: #888;
            font-family: monospace;
            font-size: 12px;
        }
        
        .commit-date {
            color: #999;
            font-size: 13px;
            margin-top: 4px;
        }
        
        .commit-author {
            color: #4CAF50;
            font-size: 13px;
        }
        
        .commit-subject {
            color: #e0e0e0;
            margin-top: 8px;
            line-height: 1.4;
        }
        
        .word-circle {
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .word-circle:hover {
            filter: brightness(1.3);
        }
        
        .word-circle:hover circle {
            stroke-width: 3px;
        }
        
        .word-text {
            pointer-events: none;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 500;
            font-size: 16px;
        }
        
        #close-sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #444;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        
        #close-sidebar:hover {
            background: #555;
        }
        
        #header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        
        #header h1 {
            color: #4CAF50;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #header p {
            color: #888;
            margin-top: 5px;
        }
        
        #legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.9);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
        }
        
        #legend h3 {
            color: #4CAF50;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 13px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="cloud-container">
            <div id="header">
                <h1>Git Commit Word Cloud</h1>
                <p>Click on any word to explore related commits</p>
            </div>
            
            <div id="legend">
                <h3>Word Types</h3>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #4CAF50; border-color: #4CAF50;"></div>
                    <span>Nouns</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #2196F3; border-color: #2196F3;"></div>
                    <span>Verbs</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #FF9800; border-color: #FF9800;"></div>
                    <span>Adjectives</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #9C27B0; border-color: #9C27B0;"></div>
                    <span>Adverbs</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #607D8B; border-color: #607D8B;"></div>
                    <span>Other</span>
                </div>
            </div>
            
            <svg id="word-cloud"></svg>
        </div>
        
        <div id="sidebar">
            <button id="close-sidebar">✕ Close</button>
            <div id="sidebar-content"></div>
        </div>
    </div>

    <script>
        let data = null;
        
        // Part of speech color mapping
        const posColors = {
            'Noun': '#4CAF50',      // Green
            'Verb': '#2196F3',      // Blue
            'Adjective': '#FF9800', // Orange
            'Adverb': '#9C27B0',    // Purple
            'Other': '#607D8B'      // Grey
        };
        
        // Detect part of speech using compromise
        function getPartOfSpeech(word) {
            const doc = nlp(word);
            
            if (doc.nouns().length > 0) return 'Noun';
            if (doc.verbs().length > 0) return 'Verb';
            if (doc.adjectives().length > 0) return 'Adjective';
            if (doc.adverbs().length > 0) return 'Adverb';
            
            return 'Other';
        }
        
        // Load data
        d3.json('commits_data.json').then(function(loadedData) {
            data = loadedData;
            
            // Analyze part of speech for each word
            data.words.forEach(word => {
                word.pos = getPartOfSpeech(word.text);
                word.color = posColors[word.pos];
            });
            
            createWordCloud();
        });
        
        function createWordCloud() {
            const sidebarActive = document.getElementById('sidebar').classList.contains('active');
            const width = window.innerWidth - (sidebarActive ? 400 : 0);
            const height = window.innerHeight;
            
            const svg = d3.select('#word-cloud')
                .attr('width', width)
                .attr('height', height);
            
            // Clear previous
            svg.selectAll('*').remove();
            
            // Calculate positions using force simulation
            const simulation = d3.forceSimulation(data.words)
                .force('charge', d3.forceManyBody().strength(-100))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(d => getRadius(d.size) + 5))
                .stop();
            
            // Run simulation
            for (let i = 0; i < 300; i++) simulation.tick();
            
            // Create word groups
            const wordGroups = svg.selectAll('.word-circle')
                .data(data.words)
                .enter()
                .append('g')
                .attr('class', 'word-circle')
                .attr('transform', d => `translate(${d.x},${d.y})`)
                .on('click', function(event, d) {
                    showCommits(d.text, d.pos);
                });
            
            // Add circles with radius based on frequency
            wordGroups.append('circle')
                .attr('r', d => getRadius(d.size))
                .attr('fill', 'none')
                .attr('stroke', d => d.color)
                .attr('stroke-width', 2)
                .attr('opacity', 0.8);
            
            // Add text
            wordGroups.append('text')
                .attr('class', 'word-text')
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'central')
                .attr('fill', d => d.color)
                .text(d => d.text);
        }
        
        // Calculate radius based on frequency
        function getRadius(frequency) {
            // Map frequency to radius range (min 25, max 80)
            const minRadius = 25;
            const maxRadius = 80;
            const maxFreq = Math.max(...data.words.map(w => w.size));
            const minFreq = Math.min(...data.words.map(w => w.size));
            
            // Linear scale
            const scale = (frequency - minFreq) / (maxFreq - minFreq);
            return minRadius + (scale * (maxRadius - minRadius));
        }
        
        function showCommits(word, pos) {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('sidebar-content');
            
            const commits = data.commits[word] || [];
            const color = posColors[pos];
            
            let html = `
                <div class="word-info">
                    <h2>${word}</h2>
                    <span class="word-type" style="background-color: ${color}20; color: ${color}; border: 1px solid ${color};">
                        ${pos}
                    </span>
                    <div class="commit-count">${commits.length} commit${commits.length !== 1 ? 's' : ''}</div>
                </div>
            `;
            
            commits.forEach(commit => {
                html += `
                    <div class="commit-item">
                        <div class="commit-hash">${commit.hash}</div>
                        <div class="commit-date">${commit.date} • <span class="commit-author">${commit.author}</span></div>
                        <div class="commit-subject">${commit.subject}</div>
                    </div>
                `;
            });
            
            content.innerHTML = html;
            sidebar.classList.add('active');
            
            // Resize word cloud
            createWordCloud();
        }
        
        document.getElementById('close-sidebar').addEventListener('click', function() {
            document.getElementById('sidebar').classList.remove('active');
            createWordCloud();
        });
        
        // Resize handler
        window.addEventListener('resize', createWordCloud);
    </script>
</body>
</html>
