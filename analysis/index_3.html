<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Commit Word Cloud Explorer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/compromise@14.9.0/builds/compromise.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }
        
        #container {
            display: flex;
            height: 100vh;
        }
        
        #cloud-container {
            flex: 1;
            position: relative;
            background: #2a2a2a;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #sidebar {
            width: 450px;
            background: #1e1e1e;
            border-left: 2px solid #444;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }
        
        #sidebar.active {
            display: block;
        }
        
        #sidebar h2 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 24px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        
        #sidebar .word-info {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        #sidebar .commit-count {
            color: #4CAF50;
            font-size: 18px;
            font-weight: bold;
        }
        
        #sidebar .word-type {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 12px;
            margin-top: 8px;
            font-weight: bold;
        }
        
        .commit-item {
            background: #333;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 3px solid #4CAF50;
            transition: transform 0.2s;
            cursor: pointer;
        }
        
        .commit-item:hover {
            transform: translateX(5px);
            background: #3a3a3a;
        }
        
        .commit-hash {
            color: #888;
            font-family: monospace;
            font-size: 12px;
        }
        
        .commit-date {
            color: #999;
            font-size: 13px;
            margin-top: 4px;
        }
        
        .commit-author {
            color: #4CAF50;
            font-size: 13px;
        }
        
        .commit-subject {
            color: #e0e0e0;
            margin-top: 8px;
            line-height: 1.4;
        }
        
        .word-circle {
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .word-circle:hover circle {
            filter: brightness(1.4);
            stroke-width: 3px;
        }
        
        .word-circle.selected circle {
            stroke-width: 4px;
            filter: brightness(1.5) drop-shadow(0 0 10px currentColor);
        }
        
        .word-text {
            pointer-events: none;
            font-family: 'Segoe UI', sans-serif;
            font-weight: 600;
            font-size: 14px;
            user-select: none;
        }
        
        #close-sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #444;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            z-index: 100;
        }
        
        #close-sidebar:hover {
            background: #555;
        }
        
        #header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        
        #header h1 {
            color: #4CAF50;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #header p {
            color: #888;
            margin-top: 5px;
        }
        
        #legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(30, 30, 30, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            z-index: 10;
        }
        
        #legend h3 {
            color: #4CAF50;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 13px;
        }
        
        .legend-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 10px;
            border: 2px solid;
        }
        
        #stats {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 13px;
            z-index: 10;
        }
        
        #stats .stat-label {
            color: #888;
        }
        
        #stats .stat-value {
            color: #4CAF50;
            font-weight: bold;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="cloud-container">
            <div id="header">
                <h1>Git Commit Word Cloud</h1>
                <p>Click on any circle to explore commits containing that word</p>
            </div>
            
            <div id="stats">
                <div><span class="stat-label">Total Words:</span> <span class="stat-value" id="total-words">0</span></div>
                <div style="margin-top: 5px;"><span class="stat-label">Total Commits:</span> <span class="stat-value" id="total-commits">0</span></div>
            </div>
            
            <div id="legend">
                <h3>Word Types</h3>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #4CAF50; border-color: #4CAF50;"></div>
                    <span>Nouns</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #2196F3; border-color: #2196F3;"></div>
                    <span>Verbs</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #FF9800; border-color: #FF9800;"></div>
                    <span>Adjectives</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #9C27B0; border-color: #9C27B0;"></div>
                    <span>Adverbs</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #607D8B; border-color: #607D8B;"></div>
                    <span>Other</span>
                </div>
            </div>
            
            <svg id="word-cloud"></svg>
        </div>
        
        <div id="sidebar">
            <button id="close-sidebar">✕ Close</button>
            <div id="sidebar-content"></div>
        </div>
    </div>

    <script>
        let data = null;
        let selectedWord = null;
        
        // Part of speech color mapping
        const posColors = {
            'Noun': '#4CAF50',      // Green
            'Verb': '#2196F3',      // Blue
            'Adjective': '#FF9800', // Orange
            'Adverb': '#9C27B0',    // Purple
            'Other': '#607D8B'      // Grey
        };
        
        // Detect part of speech using compromise
        function getPartOfSpeech(word) {
            const doc = nlp(word);
            
            if (doc.nouns().length > 0) return 'Noun';
            if (doc.verbs().length > 0) return 'Verb';
            if (doc.adjectives().length > 0) return 'Adjective';
            if (doc.adverbs().length > 0) return 'Adverb';
            
            return 'Other';
        }
        
        // Calculate radius based on frequency
        function getRadius(frequency, maxFreq, minFreq) {
            const minRadius = 30;
            const maxRadius = 100;
            
            const scale = (frequency - minFreq) / (maxFreq - minFreq);
            return minRadius + (scale * (maxRadius - minRadius));
        }
        
        // Load data
        d3.json('commits_data.json').then(function(loadedData) {
            data = loadedData;
            
            // Calculate stats
            const totalCommits = new Set();
            Object.values(data.commits).forEach(commitList => {
                commitList.forEach(commit => totalCommits.add(commit.hash));
            });
            
            document.getElementById('total-words').textContent = data.words.length;
            document.getElementById('total-commits').textContent = totalCommits.size;
            
            // Analyze part of speech for each word
            const maxFreq = Math.max(...data.words.map(w => w.size));
            const minFreq = Math.min(...data.words.map(w => w.size));
            
            data.words.forEach(word => {
                word.pos = getPartOfSpeech(word.text);
                word.color = posColors[word.pos];
                word.radius = getRadius(word.size, maxFreq, minFreq);
            });
            
            createPackedCircles();
        });
        
        function createPackedCircles() {
            const sidebarActive = document.getElementById('sidebar').classList.contains('active');
            const width = window.innerWidth - (sidebarActive ? 450 : 0);
            const height = window.innerHeight;
            
            const svg = d3.select('#word-cloud')
                .attr('width', width)
                .attr('height', height);
            
            // Clear previous
            svg.selectAll('*').remove();
            
            // Create pack layout
            const pack = d3.pack()
                .size([width * 0.9, height * 0.9])
                .padding(3);
            
            // Create hierarchy
            const root = d3.hierarchy({children: data.words})
                .sum(d => d.radius * d.radius); // Use radius squared for better packing
            
            // Apply pack layout
            pack(root);
            
            // Create container group centered
            const g = svg.append('g')
                .attr('transform', `translate(${width * 0.05},${height * 0.05})`);
            
            // Create word groups
            const nodes = g.selectAll('.word-circle')
                .data(root.leaves())
                .enter()
                .append('g')
                .attr('class', 'word-circle')
                .attr('transform', d => `translate(${d.x},${d.y})`)
                .on('click', function(event, d) {
                    // Remove previous selection
                    d3.selectAll('.word-circle').classed('selected', false);
                    // Add selection to clicked
                    d3.select(this).classed('selected', true);
                    
                    selectedWord = d.data.text;
                    showCommits(d.data.text, d.data.pos, d.data.size);
                });
            
            // Add circles
            nodes.append('circle')
                .attr('r', d => d.r)
                .attr('fill', 'none')
                .attr('stroke', d => d.data.color)
                .attr('stroke-width', 2.5)
                .attr('opacity', 0.9);
            
            // Add text
            nodes.append('text')
                .attr('class', 'word-text')
                .attr('text-anchor', 'middle')
                .attr('dominant-baseline', 'central')
                .attr('fill', d => d.data.color)
                .text(d => d.data.text)
                .each(function(d) {
                    // Wrap text if too long for circle
                    const text = d3.select(this);
                    const words = d.data.text.split(/\s+/);
                    
                    if (words.length > 1) {
                        text.text('');
                        words.forEach((word, i) => {
                            text.append('tspan')
                                .attr('x', 0)
                                .attr('dy', i === 0 ? 0 : '1.1em')
                                .text(word);
                        });
                    }
                });
        }
        
        function showCommits(word, pos, frequency) {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('sidebar-content');
            
            const commits = data.commits[word] || [];
            const color = posColors[pos];
            
            let html = `
                <div class="word-info">
                    <h2>${word}</h2>
                    <span class="word-type" style="background-color: ${color}20; color: ${color}; border: 1px solid ${color};">
                        ${pos}
                    </span>
                    <div class="commit-count" style="margin-top: 10px;">
                        ${commits.length} commit${commits.length !== 1 ? 's' : ''}
                    </div>
                    <div style="color: #888; font-size: 13px; margin-top: 5px;">
                        Frequency: ${frequency}
                    </div>
                </div>
            `;
            
            if (commits.length === 0) {
                html += '<p style="color: #888; font-style: italic;">No commits found for this word.</p>';
            } else {
                // Sort commits by date (newest first)
                const sortedCommits = [...commits].sort((a, b) => 
                    new Date(b.date) - new Date(a.date)
                );
                
                sortedCommits.forEach(commit => {
                    html += `
                        <div class="commit-item">
                            <div class="commit-hash">${commit.hash}</div>
                            <div class="commit-date">${commit.date} • <span class="commit-author">${commit.author}</span></div>
                            <div class="commit-subject">${commit.subject}</div>
                        </div>
                    `;
                });
            }
            
            content.innerHTML = html;
            sidebar.classList.add('active');
            
            // Resize word cloud to accommodate sidebar
            createPackedCircles();
        }
        
        document.getElementById('close-sidebar').addEventListener('click', function() {
            document.getElementById('sidebar').classList.remove('active');
            selectedWord = null;
            d3.selectAll('.word-circle').classed('selected', false);
            createPackedCircles();
        });
        
        // Resize handler
        window.addEventListener('resize', () => {
            createPackedCircles();
            // Restore sidebar if it was open
            if (selectedWord) {
                const wordData = data.words.find(w => w.text === selectedWord);
                if (wordData) {
                    showCommits(selectedWord, wordData.pos, wordData.size);
                }
            }
        });
    </script>
</body>
</html>
