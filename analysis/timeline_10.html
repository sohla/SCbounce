<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Commit Flow - Click to Toggle</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://unpkg.com/d3-sankey@0.12.3/dist/d3-sankey.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #controls {
            background: #2a2a2a;
            padding: 20px;
            border-bottom: 2px solid #444;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        #controls h3 {
            color: #4CAF50;
            margin-right: 10px;
        }

        .toggle-btn {
            padding: 8px 16px;
            border: 2px solid;
            background: #2a2a2a;
            color: #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
            transition: all 0.2s;
            position: relative;
        }

        .toggle-btn::before {
            content: '';
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
            vertical-align: middle;
        }

        .toggle-btn.implementation {
            border-color: #2196F3;
        }

        .toggle-btn.implementation::before {
            background: #2196F3;
        }

        .toggle-btn.implementation.active {
            background: #2196F3;
            color: #1a1a1a;
        }

        .toggle-btn.personality {
            border-color: #FF9800;
        }

        .toggle-btn.personality::before {
            background: #FF9800;
        }

        .toggle-btn.personality.active {
            background: #FF9800;
            color: #1a1a1a;
        }

        .toggle-btn.other {
            border-color: #9C27B0;
        }

        .toggle-btn.other::before {
            background: #9C27B0;
        }

        .toggle-btn.other.active {
            background: #9C27B0;
            color: #1a1a1a;
        }

        .toggle-btn:hover {
            opacity: 0.8;
        }

        .toggle-btn:not(.active) {
            opacity: 0.5;
        }

        .period-btn {
            padding: 6px 12px;
            border: 2px solid #444;
            background: #2a2a2a;
            color: #e0e0e0;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s;
        }

        .period-btn:hover {
            border-color: #666;
            background: #333;
        }

        .period-btn.active {
            background: #4CAF50;
            border-color: #4CAF50;
            color: #1a1a1a;
        }

        #main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        #chart-container {
            flex: 1;
            position: relative;
            background: #2a2a2a;
            overflow: auto;
        }

        #chart-wrapper {
            position: relative;
            min-height: 100%;
        }

        #sidebar {
            width: 450px;
            background: #1e1e1e;
            border-left: 2px solid #444;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }

        #sidebar.active {
            display: block;
        }

        #sidebar h2 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 24px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }

        #sidebar .flow-info {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        #sidebar .commit-count {
            color: #4CAF50;
            font-size: 18px;
            font-weight: bold;
        }

        .commit-item {
            background: #333;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 3px solid #4CAF50;
            transition: transform 0.2s;
            cursor: pointer;
        }

        .commit-item.implementation {
            border-left-color: #2196F3;
        }

        .commit-item.personality {
            border-left-color: #FF9800;
        }

        .commit-item.other {
            border-left-color: #9C27B0;
        }

        .commit-item:hover {
            transform: translateX(5px);
            background: #3a3a3a;
        }

        .commit-hash {
            color: #888;
            font-family: monospace;
            font-size: 12px;
        }

        .commit-date {
            color: #999;
            font-size: 13px;
            margin-top: 4px;
        }

        .commit-author {
            color: #4CAF50;
            font-size: 13px;
        }

        .commit-subject {
            color: #e0e0e0;
            margin-top: 8px;
            line-height: 1.4;
        }

        .commit-type-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            margin-left: 8px;
        }

        .commit-type-badge.implementation {
            background: #2196F320;
            color: #2196F3;
            border: 1px solid #2196F3;
        }

        .commit-type-badge.personality {
            background: #FF980020;
            color: #FF9800;
            border: 1px solid #FF9800;
        }

        .commit-type-badge.other {
            background: #9C27B020;
            color: #9C27B0;
            border: 1px solid #9C27B0;
        }

        #close-sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #444;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            z-index: 100;
        }

        #close-sidebar:hover {
            background: #555;
        }

        #header {
            position: sticky;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        #header h1 {
            color: #4CAF50;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        #header p {
            color: #888;
            margin-top: 5px;
        }

        #stats {
            position: sticky;
            top: 20px;
            right: 20px;
            background: rgba(30, 30, 30, 0.95);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #444;
            font-size: 13px;
            z-index: 10;
            float: right;
            margin: 20px;
        }

        #stats .stat-label {
            color: #888;
        }

        #stats .stat-value {
            color: #4CAF50;
            font-weight: bold;
            font-size: 16px;
        }

        .sankey-node rect {
            cursor: pointer;
            transition: all 0.3s;
        }

        .sankey-node rect:hover {
            opacity: 1;
        }

        .sankey-node.time rect {
            fill: #4CAF50;
        }

        .sankey-node.category.implementation rect {
            fill: #2196F3;
        }

        .sankey-node.category.personality rect {
            fill: #FF9800;
        }

        .sankey-node.category.other rect {
            fill: #9C27B0;
        }

        .sankey-node.file rect {
            fill: #607D8B;
        }

        /* Highlighting states for nodes */
        .sankey-node.dimmed rect {
            opacity: 0.2;
        }

        .sankey-node.highlighted rect {
            opacity: 1;
            filter: brightness(1.4) drop-shadow(0 0 8px currentColor);
        }

        .sankey-node.selected rect {
            stroke: #fff;
            stroke-width: 3px;
            filter: brightness(1.5) drop-shadow(0 0 12px currentColor);
        }

        .sankey-node text {
            fill: #e0e0e0;
            font-size: 11px;
            pointer-events: none;
            transition: all 0.3s;
        }

        .sankey-node.dimmed text {
            opacity: 0.3;
        }

        .sankey-node.highlighted text {
            fill: #fff;
            font-weight: bold;
        }

        .sankey-node.selected text {
            fill: #fff;
            font-weight: bold;
        }

        .sankey-link {
            fill: none;
            stroke-opacity: 0.3;
            transition: stroke-opacity 0.3s;
            cursor: pointer;
        }

        .sankey-link:hover {
            stroke-opacity: 0.6;
        }

        .sankey-link.highlighted {
            stroke-opacity: 0.8;
            filter: brightness(1.3);
        }

        .sankey-link.dimmed {
            stroke-opacity: 0.05;
        }

        .tooltip {
            position: fixed;
            background: rgba(30, 30, 30, 0.95);
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #4CAF50;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            font-size: 13px;
            z-index: 100;
        }

        .tooltip.visible {
            opacity: 1;
        }

        .tooltip-title {
            color: #4CAF50;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .tooltip-value {
            color: #e0e0e0;
        }

        .column-label {
            fill: #888;
            font-size: 14px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="controls">
            <h3>Show Categories:</h3>
            <button class="toggle-btn implementation active" data-category="implementation">Implementation</button>
            <button class="toggle-btn personality active" data-category="personality">Personality</button>
            <button class="toggle-btn other active" data-category="other">Other</button>

            <div style="margin-left: 30px; padding-left: 30px; border-left: 1px solid #444; display: flex; gap: 10px; align-items: center;">
                <h3>Time Grouping:</h3>
                <button class="period-btn" data-period="quarter">Quarter</button>
                <button class="period-btn active" data-period="month">Month</button>
            </div>
        </div>

        <div id="main-content">
            <div id="chart-container">
                <div id="chart-wrapper">
                    <div id="header">
                        <h1>Click to Toggle Highlighting</h1>
                        <p>Click on nodes to lock highlighting, click again to unlock</p>
                    </div>

                    <div id="stats">
                        <div><span class="stat-label">Visible Commits:</span> <span class="stat-value" id="visible-commits">0</span></div>
                        <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #444;">
                            <div style="font-size: 12px; color: #888; margin-bottom: 5px;">Filtered By:</div>
                            <div style="font-size: 11px;"><span style="color: #2196F3;">■</span> Implementation: <span id="stat-implementation">0</span></div>
                            <div style="font-size: 11px;"><span style="color: #FF9800;">■</span> Personality: <span id="stat-personality">0</span></div>
                            <div style="font-size: 11px;"><span style="color: #9C27B0;">■</span> Other: <span id="stat-other">0</span></div>
                        </div>
                        <div style="margin-top: 10px; padding-top: 10px; border-top: 1px solid #444;">
                            <div style="font-size: 12px; color: #888; margin-bottom: 5px;">Files:</div>
                            <div style="font-size: 11px;" id="stat-files">0</div>
                        </div>
                    </div>

                    <svg id="sankey-chart"></svg>
                </div>
                <div class="tooltip"></div>
            </div>

            <div id="sidebar">
                <button id="close-sidebar">✕ Close</button>
                <div id="sidebar-content"></div>
            </div>
        </div>
    </div>

    <script>
        let data = null;
        let allCommits = [];
        let currentPeriod = 'month';
        let visibleCategories = new Set(['implementation', 'personality', 'other']);
        let selectedNode = null;

        // File categorization function
        function categorizeFile(filePath) {
            if (!filePath || filePath === '.DS_Store') return null;

            const personalityPatterns = ['personalities/', 'lists/', 'personalityController'];
            const codePatterns = ['code2.0/', 'code3.0/'];

            if (personalityPatterns.some(pattern => filePath.includes(pattern))) {
                return 'personality';
            } else if (codePatterns.some(pattern => filePath.includes(pattern))) {
                return 'implementation';
            } else {
                return 'other';
            }
        }

        // Load and process data
        d3.json('output/commits_data.json').then(function(loadedData) {
            data = loadedData;

            // Extract all commits
            Object.values(data.commits).forEach(commitList => {
                commitList.forEach(commit => {
                    if (!allCommits.find(c => c.hash === commit.hash)) {
                        allCommits.push({
                            ...commit,
                            datetime: new Date(commit.datetime)
                        });
                    }
                });
            });

            // Sort by date
            allCommits.sort((a, b) => a.datetime - b.datetime);

            // Initial render
            updateVisualization();
        });

        // Set up toggle buttons
        document.querySelectorAll('.toggle-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                const category = this.dataset.category;

                if (visibleCategories.has(category)) {
                    visibleCategories.delete(category);
                    this.classList.remove('active');
                } else {
                    visibleCategories.add(category);
                    this.classList.add('active');
                }

                updateVisualization();
            });
        });

        // Set up period buttons
        document.querySelectorAll('.period-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentPeriod = this.dataset.period;
                updateVisualization();
            });
        });

        function getPeriodKey(date, period) {
            if (period === 'quarter') {
                const year = date.getFullYear();
                const quarter = Math.floor(date.getMonth() / 3) + 1;
                return { key: `${year}-Q${quarter}`, sort: year * 10 + quarter };
            } else {
                const year = date.getFullYear();
                const month = date.getMonth() + 1;
                return { key: `${year}-${String(month).padStart(2, '0')}`, sort: year * 100 + month };
            }
        }

        function getPeriodLabel(key, period) {
            if (period === 'quarter') {
                return key;
            } else {
                const [year, month] = key.split('-');
                const date = new Date(year, parseInt(month) - 1);
                return d3.timeFormat('%b %Y')(date);
            }
        }

        function buildSankeyData(commits, period, categories) {
            const nodes = [];
            const links = [];
            const nodeMap = new Map();

            // Helper to get or create node
            function getNode(id, name, layer, type = null, sortKey = null) {
                if (!nodeMap.has(id)) {
                    const node = { id, name, layer, type, sortKey };
                    nodes.push(node);
                    nodeMap.set(id, id);
                }
                return id;
            }

            // Track flows
            const flowMap = new Map();

            function addFlow(source, target, commit) {
                const key = `${source}-${target}`;
                if (!flowMap.has(key)) {
                    flowMap.set(key, { source, target, commits: [] });
                }
                flowMap.get(key).commits.push(commit);
            }

            // Pre-create all visible category nodes to ensure consistent positioning
            // This prevents personality from being "node 1 of 2" when combined with another category
            categories.forEach(cat => {
                getNode(`cat-${cat}`, cat, 1, cat);
            });

            // Process commits
            commits.forEach(commit => {
                const periodData = getPeriodKey(commit.datetime, period);

                // Create time node
                const timeNode = getNode(
                    `time-${periodData.key}`,
                    getPeriodLabel(periodData.key, period),
                    0,
                    'time',
                    periodData.sort
                );

                // Process each file in the commit
                if (commit.files) {
                    commit.files.forEach(file => {
                        const category = categorizeFile(file);

                        // Only include if category is visible
                        if (category && categories.has(category)) {
                            // Create category node
                            const catNode = getNode(`cat-${category}`, category, 1, category);

                            // Add flow from time to category
                            addFlow(timeNode, catNode, commit);

                            // Create file node
                            const fileName = file.split('/').pop() || file;
                            const fileNode = getNode(`file-${file}`, fileName, 2, 'file');

                            // Add flow from category to file
                            addFlow(catNode, fileNode, commit);
                        }
                    });
                }
            });

            // Sort nodes
            nodes.sort((a, b) => {
                if (a.layer !== b.layer) return a.layer - b.layer;

                if (a.layer === 0 && a.sortKey !== null && b.sortKey !== null) {
                    return a.sortKey - b.sortKey;
                }

                if (a.layer === 1) {
                    const order = { implementation: 0, personality: 1, other: 2 };
                    return (order[a.name] || 999) - (order[b.name] || 999);
                }

                return a.name.localeCompare(b.name);
            });

            // Convert flows to links
            flowMap.forEach(flow => {
                links.push({
                    source: flow.source,
                    target: flow.target,
                    value: flow.commits.length,
                    commits: flow.commits
                });
            });

            return { nodes, links };
        }

        function updateVisualization() {
            const sankeyData = buildSankeyData(allCommits, currentPeriod, visibleCategories);

            // Update stats
            const fileCounts = { implementation: 0, personality: 0, other: 0 };
            const uniqueFiles = new Set();
            const uniqueCommits = new Set();

            allCommits.forEach(commit => {
                if (commit.files) {
                    commit.files.forEach(file => {
                        const category = categorizeFile(file);
                        if (category && visibleCategories.has(category)) {
                            uniqueFiles.add(file);
                            uniqueCommits.add(commit.hash);
                            if (!fileCounts[category + '_' + file]) {
                                fileCounts[category]++;
                                fileCounts[category + '_' + file] = true;
                            }
                        }
                    });
                }
            });

            document.getElementById('visible-commits').textContent = uniqueCommits.size;
            document.getElementById('stat-implementation').textContent = fileCounts.implementation;
            document.getElementById('stat-personality').textContent = fileCounts.personality;
            document.getElementById('stat-other').textContent = fileCounts.other;
            document.getElementById('stat-files').textContent = uniqueFiles.size;

            drawSankey(sankeyData);
        }

        function drawSankey(data) {
            const sidebarActive = document.getElementById('sidebar').classList.contains('active');
            const width = window.innerWidth - (sidebarActive ? 450 : 0);
            const minHeight = window.innerHeight - 80;
            const height = Math.max(minHeight, data.nodes.length * 30 + 400);
            const margin = { top: 80, right: 150, bottom: 100, left: 150 };
            const chartWidth = width - margin.left - margin.right;
            const chartHeight = height - margin.top - margin.bottom;

            const svg = d3.select('#sankey-chart')
                .attr('width', width)
                .attr('height', height);

            svg.selectAll('*').remove();

            if (data.nodes.length === 0) {
                svg.append('text')
                    .attr('x', width / 2)
                    .attr('y', height / 2)
                    .attr('text-anchor', 'middle')
                    .attr('fill', '#888')
                    .attr('font-size', '18px')
                    .text('No categories selected');
                return;
            }

            const g = svg.append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);

            // Create sankey generator
            const sankey = d3.sankey()
                .nodeId(d => d.id)
                .nodeWidth(15)
                .nodePadding(15)
                .nodeSort((a, b) => {
                    if (a.layer !== b.layer) return a.layer - b.layer;

                    if (a.layer === 0 && a.sortKey !== null && b.sortKey !== null) {
                        return a.sortKey - b.sortKey;
                    }

                    if (a.layer === 1) {
                        const order = { implementation: 0, personality: 1, other: 2 };
                        return (order[a.name] || 999) - (order[b.name] || 999);
                    }

                    return a.name.localeCompare(b.name);
                })
                .extent([[0, 0], [chartWidth, chartHeight]]);

            // Generate sankey layout
            const graph = sankey({
                nodes: data.nodes.map(d => Object.assign({}, d)),
                links: data.links.map(d => Object.assign({}, d))
            });

            // Color scale for links
            const categoryColors = {
                implementation: '#2196F3',
                personality: '#FF9800',
                other: '#9C27B0'
            };

            function getLinkColor(d) {
                const sourceNode = d.source;
                const targetNode = d.target;

                if (sourceNode.layer === 0 && targetNode.layer === 1) {
                    return categoryColors[targetNode.type] || '#888';
                } else if (sourceNode.layer === 1 && targetNode.layer === 2) {
                    return categoryColors[sourceNode.type] || '#888';
                }
                return '#888';
            }

            const tooltip = d3.select('.tooltip');

            // Helper function to get connected nodes and links based on layer
            function getConnectedElements(node) {
                const connectedLinks = new Set();
                const connectedNodes = new Set();

                // Always add the starting node
                connectedNodes.add(node.id);

                if (node.layer === 0) {
                    // TIME PERIOD: highlight only files changed in THIS period
                    const timeCommitHashes = new Set();

                    // Collect commit hashes from time → category links
                    graph.links.forEach(link => {
                        if (link.source.id === node.id) {
                            connectedLinks.add(link);
                            link.commits.forEach(commit => {
                                timeCommitHashes.add(commit.hash);
                            });
                        }
                    });

                    // Find category → file links with matching commits
                    graph.links.forEach(link => {
                        if (link.source.layer === 1) { // category → file
                            const hasMatchingCommit = link.commits.some(c => timeCommitHashes.has(c.hash));
                            if (hasMatchingCommit) {
                                connectedLinks.add(link);
                                connectedNodes.add(link.target.id); // file
                            }
                        }
                    });
                } else if (node.layer === 2) {
                    // FILE: highlight only time periods where THIS file was changed
                    const fileCommitHashes = new Set();

                    // Collect commit hashes from category → file links
                    graph.links.forEach(link => {
                        if (link.target.id === node.id) {
                            connectedLinks.add(link);
                            link.commits.forEach(commit => {
                                fileCommitHashes.add(commit.hash);
                            });
                        }
                    });

                    // Find time → category links with matching commits
                    graph.links.forEach(link => {
                        if (link.target.layer === 1) { // time → category
                            const hasMatchingCommit = link.commits.some(c => fileCommitHashes.has(c.hash));
                            if (hasMatchingCommit) {
                                connectedLinks.add(link);
                                connectedNodes.add(link.source.id); // time period
                            }
                        }
                    });
                } else if (node.layer === 1) {
                    // CATEGORY: highlight direct connections only
                    graph.links.forEach(link => {
                        if (link.source.id === node.id) {
                            connectedLinks.add(link);
                            connectedNodes.add(link.target.id);
                        }
                        if (link.target.id === node.id) {
                            connectedLinks.add(link);
                            connectedNodes.add(link.source.id);
                        }
                    });
                }

                return { nodes: connectedNodes, links: connectedLinks };
            }

            // Function to apply highlighting based on selected node
            function applyHighlighting() {
                if (selectedNode) {
                    const connected = getConnectedElements(selectedNode);

                    // Highlight connected nodes
                    nodeElements.classed('highlighted', n => connected.nodes.has(n.id))
                                .classed('dimmed', n => !connected.nodes.has(n.id))
                                .classed('selected', n => n.id === selectedNode.id);

                    // Highlight connected links
                    linkElements.classed('highlighted', l => connected.links.has(l))
                               .classed('dimmed', l => !connected.links.has(l));
                } else {
                    // Clear all highlighting
                    nodeElements.classed('highlighted', false)
                                .classed('dimmed', false)
                                .classed('selected', false);
                    linkElements.classed('highlighted', false)
                                .classed('dimmed', false);
                }
            }

            // Draw links
            const linkElements = g.append('g')
                .selectAll('.sankey-link')
                .data(graph.links)
                .enter()
                .append('path')
                .attr('class', 'sankey-link')
                .attr('d', d3.sankeyLinkHorizontal())
                .attr('stroke', d => getLinkColor(d))
                .attr('stroke-width', d => Math.max(1, d.width))
                .on('mouseover', function(event, d) {
                    const sourceName = d.source.name;
                    const targetName = d.target.name;

                    tooltip.html(`
                        <div class="tooltip-title">${sourceName} → ${targetName}</div>
                        <div class="tooltip-value">${d.value} commit${d.value !== 1 ? 's' : ''}</div>
                    `)
                    .style('left', (event.pageX + 10) + 'px')
                    .style('top', (event.pageY - 30) + 'px')
                    .classed('visible', true);
                })
                .on('mouseout', function() {
                    tooltip.classed('visible', false);
                })
                .on('click', function(event, d) {
                    showCommits(d);
                });

            // Draw nodes
            const nodeElements = g.append('g')
                .selectAll('.sankey-node')
                .data(graph.nodes)
                .enter()
                .append('g')
                .attr('class', d => `sankey-node ${d.type || ''} ${d.layer === 1 ? 'category' : ''}`)
                .attr('transform', d => `translate(${d.x0},${d.y0})`)
                .on('mouseover', function(event, d) {
                    // Only show tooltip on hover, don't change highlighting
                    tooltip.html(`
                        <div class="tooltip-title">${d.name}</div>
                        <div class="tooltip-value">${d.value} commit${d.value !== 1 ? 's' : ''}</div>
                        <div style="margin-top: 5px; font-size: 11px; color: #888;">Click to toggle highlighting</div>
                    `)
                    .style('left', (event.pageX + 10) + 'px')
                    .style('top', (event.pageY - 30) + 'px')
                    .classed('visible', true);
                })
                .on('mouseout', function() {
                    tooltip.classed('visible', false);
                })
                .on('click', function(event, d) {
                    // Toggle selection
                    if (selectedNode && selectedNode.id === d.id) {
                        // Clicking the same node - deselect
                        selectedNode = null;
                    } else {
                        // Clicking a new node - select it
                        selectedNode = d;
                    }
                    applyHighlighting();
                });

            nodeElements.append('rect')
                .attr('height', d => d.y1 - d.y0)
                .attr('width', d => d.x1 - d.x0);

            // Add node labels
            nodeElements.append('text')
                .attr('x', d => d.x0 < chartWidth / 2 ? (d.x1 - d.x0 + 6) : -6)
                .attr('y', d => (d.y1 - d.y0) / 2)
                .attr('dy', '0.35em')
                .attr('text-anchor', d => d.x0 < chartWidth / 2 ? 'start' : 'end')
                .text(d => d.name);

            // Add column labels
            const columnLabels = [
                { x: 0, y: -30, text: 'Time Periods' },
                { x: chartWidth / 2, y: -30, text: 'File Categories' },
                { x: chartWidth, y: -30, text: 'Files' }
            ];

            g.selectAll('.column-label')
                .data(columnLabels)
                .enter()
                .append('text')
                .attr('class', 'column-label')
                .attr('x', d => d.x)
                .attr('y', d => d.y)
                .attr('text-anchor', 'middle')
                .text(d => d.text);

            // Apply initial highlighting if there's a selected node
            applyHighlighting();
        }

        function showCommits(linkData) {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('sidebar-content');

            const commits = linkData.commits || [];
            const sourceName = linkData.source.name;
            const targetName = linkData.target.name;

            // Determine category for styling
            let category = 'other';
            if (linkData.source.layer === 1) {
                category = linkData.source.name;
            } else if (linkData.target.layer === 1) {
                category = linkData.target.name;
            }

            let html = `
                <div class="flow-info">
                    <h2>Flow Details</h2>
                    <div style="color: #888; font-size: 14px; margin-top: 10px;">
                        ${sourceName} → ${targetName}
                    </div>
                    <div class="commit-count" style="margin-top: 10px;">
                        ${commits.length} commit${commits.length !== 1 ? 's' : ''}
                    </div>
                </div>
            `;

            // Get unique commits and sort by date
            const uniqueCommits = Array.from(new Set(commits.map(c => c.hash)))
                .map(hash => commits.find(c => c.hash === hash))
                .sort((a, b) => b.datetime - a.datetime);

            uniqueCommits.forEach(commit => {
                html += `
                    <div class="commit-item ${category}">
                        <div class="commit-hash">${commit.hash}<span class="commit-type-badge ${category}">${category}</span></div>
                        <div class="commit-date">${commit.date} • <span class="commit-author">${commit.author}</span></div>
                        <div class="commit-subject">${commit.subject}</div>
                    </div>
                `;
            });

            content.innerHTML = html;
            sidebar.classList.add('active');
            updateVisualization();
        }

        document.getElementById('close-sidebar').addEventListener('click', function() {
            document.getElementById('sidebar').classList.remove('active');
            updateVisualization();
        });

        window.addEventListener('resize', () => {
            updateVisualization();
        });
    </script>
</body>
</html>
