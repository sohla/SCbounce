<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Git Commit Word Cloud Explorer</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-cloud@1.2.5/build/d3.layout.cloud.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            overflow: hidden;
        }
        
        #container {
            display: flex;
            height: 100vh;
        }
        
        #cloud-container {
            flex: 1;
            position: relative;
            background: #2a2a2a;
        }
        
        #sidebar {
            width: 400px;
            background: #1e1e1e;
            border-left: 2px solid #444;
            overflow-y: auto;
            padding: 20px;
            display: none;
        }
        
        #sidebar.active {
            display: block;
        }
        
        #sidebar h2 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 24px;
            border-bottom: 2px solid #4CAF50;
            padding-bottom: 10px;
        }
        
        #sidebar .word-info {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        
        #sidebar .commit-count {
            color: #4CAF50;
            font-size: 18px;
            font-weight: bold;
        }
        
        .commit-item {
            background: #333;
            padding: 12px;
            margin: 10px 0;
            border-radius: 6px;
            border-left: 3px solid #4CAF50;
            transition: transform 0.2s;
        }
        
        .commit-item:hover {
            transform: translateX(5px);
            background: #3a3a3a;
        }
        
        .commit-hash {
            color: #888;
            font-family: monospace;
            font-size: 12px;
        }
        
        .commit-date {
            color: #999;
            font-size: 13px;
            margin-top: 4px;
        }
        
        .commit-author {
            color: #4CAF50;
            font-size: 13px;
        }
        
        .commit-subject {
            color: #e0e0e0;
            margin-top: 8px;
            line-height: 1.4;
        }
        
        .word {
            cursor: pointer;
            transition: opacity 0.3s;
        }
        
        .word:hover {
            opacity: 0.7;
        }
        
        #close-sidebar {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #444;
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        
        #close-sidebar:hover {
            background: #555;
        }
        
        #header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
        }
        
        #header h1 {
            color: #4CAF50;
            font-size: 28px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        
        #header p {
            color: #888;
            margin-top: 5px;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="cloud-container">
            <div id="header">
                <h1>Git Commit Word Cloud</h1>
                <p>Click on any word to explore related commits</p>
            </div>
            <svg id="word-cloud"></svg>
        </div>
        
        <div id="sidebar">
            <button id="close-sidebar">✕ Close</button>
            <div id="sidebar-content"></div>
        </div>
    </div>

    <script>
        let data = null;
        
        // Load data
        d3.json('commits_data.json').then(function(loadedData) {
            data = loadedData;
            createWordCloud();
        });
        
        function createWordCloud() {
            const width = window.innerWidth - (sidebar.classList.contains('active') ? 400 : 0);
            const height = window.innerHeight;
            
            const svg = d3.select('#word-cloud')
                .attr('width', width)
                .attr('height', height);
            
            // Clear previous
            svg.selectAll('*').remove();
            
            // Create word cloud layout
            const layout = d3.layout.cloud()
                .size([width, height])
                .words(data.words.map(d => ({
                    text: d.text,
                    size: d.size
                })))
                .padding(8)
                .rotate(() => 0)
                .fontSize(d => Math.sqrt(d.size) * 10)
                .on('end', draw);
            
            layout.start();
            
            function draw(words) {
                const g = svg.append('g')
                    .attr('transform', `translate(${width/2},${height/2})`);
                
                const text = g.selectAll('text')
                    .data(words)
                    .enter().append('text')
                    .attr('class', 'word')
                    .style('font-size', d => d.size + 'px')
                    .style('font-family', 'Impact, sans-serif')
                    .style('fill', (d, i) => d3.schemeCategory10[i % 10])
                    .attr('text-anchor', 'middle')
                    .attr('transform', d => `translate(${d.x},${d.y})`)
                    .text(d => d.text)
                    .on('click', function(event, d) {
                        showCommits(d.text);
                    });
            }
        }
        
        function showCommits(word) {
            const sidebar = document.getElementById('sidebar');
            const content = document.getElementById('sidebar-content');
            
            const commits = data.commits[word] || [];
            
            let html = `
                <div class="word-info">
                    <h2>${word}</h2>
                    <div class="commit-count">${commits.length} commits</div>
                </div>
            `;
            
            commits.forEach(commit => {
                html += `
                    <div class="commit-item">
                        <div class="commit-hash">${commit.hash}</div>
                        <div class="commit-date">${commit.date} • <span class="commit-author">${commit.author}</span></div>
                        <div class="commit-subject">${commit.subject}</div>
                    </div>
                `;
            });
            
            content.innerHTML = html;
            sidebar.classList.add('active');
            
            // Resize word cloud
            createWordCloud();
        }
        
        document.getElementById('close-sidebar').addEventListener('click', function() {
            document.getElementById('sidebar').classList.remove('active');
            createWordCloud();
        });
        
        // Resize handler
        window.addEventListener('resize', createWordCloud);
    </script>
</body>
</html>
