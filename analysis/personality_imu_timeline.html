<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personality Files: IMU Data Timeline - SCbounce Evolution</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #e0e0e0;
            overflow: hidden;
        }

        #container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        #timeline-controls {
            background: #1a1a1a;
            padding: 20px;
            border-bottom: 2px solid #333;
            display: flex;
            align-items: center;
            gap: 20px;
            flex-shrink: 0;
            flex-wrap: wrap;
        }

        #timeline-controls h3 {
            color: #4CAF50;
            margin-right: 20px;
            min-width: 150px;
            font-size: 18px;
        }

        #timeline-slider {
            flex: 1;
            height: 10px;
            background: #333;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
            min-width: 300px;
        }

        #timeline-slider::-webkit-slider-thumb {
            appearance: none;
            width: 24px;
            height: 24px;
            background: #4CAF50;
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.4);
        }

        #timeline-slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            background: #4CAF50;
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.4);
        }

        .date-label {
            color: #888;
            font-size: 14px;
            min-width: 100px;
            text-align: center;
        }

        #current-date {
            color: #4CAF50;
            font-weight: bold;
            font-size: 16px;
        }

        #filter-controls {
            display: flex;
            gap: 15px;
            align-items: center;
            padding: 15px 20px;
            background: #111;
            border-bottom: 2px solid #333;
            flex-wrap: wrap;
        }

        #filter-controls h4 {
            color: #4CAF50;
            min-width: 80px;
        }

        #category-filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .category-filter {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            background: #222;
            border: 1px solid #444;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 12px;
        }

        .category-filter:hover {
            background: #333;
        }

        .category-filter.active {
            background: #4CAF50;
            color: #000;
            border-color: #4CAF50;
        }

        .category-filter.disabled {
            opacity: 0.5;
            background: #1a1a1a;
        }

        .filter-color {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }

        #visualization-area {
            flex: 1;
            position: relative;
            background: linear-gradient(135deg, #0a0a0a 0%, #111 100%);
            overflow: hidden;
        }

        #chart-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .chart-tooltip {
            position: absolute;
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 10px;
            border-radius: 5px;
            pointer-events: none;
            font-size: 12px;
            border: 1px solid #666;
            z-index: 1000;
            max-width: 250px;
        }

        .legend {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(10px);
            min-width: 150px;
        }

        .legend h5 {
            color: #4CAF50;
            margin-bottom: 10px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            margin: 5px 0;
            font-size: 12px;
        }

        .legend-color {
            width: 16px;
            height: 16px;
            margin-right: 8px;
            border-radius: 3px;
        }

        #view-controls {
            position: absolute;
            top: 20px;
            left: 20px;
            display: flex;
            gap: 10px;
        }

        .view-button {
            background: #333;
            border: 1px solid #666;
            color: #fff;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .view-button:hover {
            background: #444;
        }

        .view-button.active {
            background: #4CAF50;
            color: #000;
        }

        #stats-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(26, 26, 26, 0.95);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 15px;
            backdrop-filter: blur(10px);
            min-width: 200px;
        }

        #stats-panel h4 {
            color: #4CAF50;
            margin-bottom: 10px;
            font-size: 14px;
        }

        .stat-item {
            display: flex;
            justify-content: space-between;
            margin: 5px 0;
            font-size: 12px;
        }

        .stat-value {
            color: #4CAF50;
            font-weight: bold;
        }

        .bubble-chart .file-bubble {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .bubble-chart .file-bubble:hover {
            stroke-width: 2;
            stroke: #4CAF50;
        }

        .axis {
            stroke: #666;
            stroke-width: 1;
        }

        .axis text {
            fill: #888;
            font-size: 10px;
        }

        .grid-line {
            stroke: #333;
            stroke-width: 0.5;
            stroke-dasharray: 2,2;
        }

        @keyframes pulse {
            0% {
                opacity: 0.6;
                stroke-width: 2;
            }
            50% {
                opacity: 1;
                stroke-width: 4;
            }
            100% {
                opacity: 0.6;
                stroke-width: 2;
            }
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="timeline-controls">
            <h3>🎛️ IMU Data Timeline</h3>
            <span class="date-label" id="start-date">2024-01</span>
            <input type="range" id="timeline-slider" min="0" max="100" value="100">
            <span class="date-label" id="end-date">2026-04</span>
            <div id="current-date">2026-04</div>
        </div>
        
        <div id="filter-controls">
            <h4>IMU Types:</h4>
            <div id="category-filters"></div>
        </div>

        <div id="visualization-area">
            <div id="view-controls">
                <button class="view-button active" data-view="bubbles">File Bubbles</button>
                <button class="view-button" data-view="timeline">Linear Timeline</button>
                <button class="view-button" data-view="complexity">Complexity View</button>
            </div>

            <div id="stats-panel">
                <h4>Current Period Stats</h4>
                <div class="stat-item">
                    <span>Total Files:</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
                <div class="stat-item">
                    <span>Gyro Changes:</span>
                    <span class="stat-value" id="stat-gyro">0</span>
                </div>
                <div class="stat-item">
                    <span>Accel Changes:</span>
                    <span class="stat-value" id="stat-accel">0</span>
                </div>
                <div class="stat-item">
                    <span>RRate Changes:</span>
                    <span class="stat-value" id="stat-rrate">0</span>
                </div>
                <div class="stat-item">
                    <span>Button Changes:</span>
                    <span class="stat-value" id="stat-button">0</span>
                </div>
                <div class="stat-item">
                    <span>Mixed Commits:</span>
                    <span class="stat-value" id="stat-both">0</span>
                </div>
                <div class="stat-item">
                    <span>Avg Magnitude:</span>
                    <span class="stat-value" id="stat-complexity">0</span>
                </div>
            </div>

            <div id="chart-container"></div>

            <div class="legend">
                <h5>IMU Data Types</h5>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #ff6b6b;"></div>
                    <span>Gyro Only</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #4ecdc4;"></div>
                    <span>Accel Only</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #9b59b6;"></div>
                    <span>Rotation Rate</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #45b7d1;"></div>
                    <span>Button Only</span>
                </div>
                <div class="legend-item">
                    <div class="legend-color" style="background-color: #feca57;"></div>
                    <span>Mixed Types</span>
                </div>
            </div>
        </div>
    </div>

    <div class="chart-tooltip" id="tooltip" style="display: none;"></div>

    <script>
        // Global variables
        let data = null;
        let allFiles = [];
        let filteredFiles = [];
        let currentDate = new Date('2026-04-01');
        let minDate = new Date('2024-01-01');
        let maxDate = new Date('2026-04-01');
        let currentView = 'bubbles';
        let activeFilters = new Set(['gyro', 'accel', 'rrate', 'button', 'mixed']);
        
        // Color scheme for IMU categories
        const colors = {
            'gyro': '#ff6b6b',
            'accel': '#4ecdc4', 
            'rrate': '#9b59b6',
            'button': '#45b7d1',
            'mixed': '#feca57',
            'none': '#778ca3'
        };

        // Load and process data
        async function loadData() {
            try {
                const response = await fetch('commit_imu_analysis.json');
                data = await response.json();
                
                console.log('Loaded commit IMU data:', data);
                processCommits();
                setupFilters();
                setupControls();
                updateVisualization();
                
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }

        function processCommits() {
            allFiles = [];
            
            // Group commits by personality file to create file-centric view
            const fileActivity = new Map();
            
            data.commits.forEach(commit => {
                const commitDate = new Date(commit.date);
                
                // Process each file changed in this commit
                commit.changed_files.forEach(filePath => {
                    const fileName = filePath.replace('personalities/', '').replace('.sc', '');
                    
                    if (!fileActivity.has(fileName)) {
                        fileActivity.set(fileName, []);
                    }
                    
                    fileActivity.get(fileName).push({
                        date: commitDate,
                        hash: commit.hash,
                        author: commit.author,
                        message: commit.message,
                        gyro_changes: commit.imu_changes.gyro_changes.length,
                        accel_changes: commit.imu_changes.accel_changes.length,
                        rrate_changes: commit.imu_changes.rrate_changes.length,
                        button_changes: commit.imu_changes.button_changes.length,
                        total_magnitude: commit.change_magnitude
                    });
                });
            });
            
            // Convert to timeline format - each entry is a file at a point in time
            const timeline = [];
            fileActivity.forEach((commits, fileName) => {
                commits.sort((a, b) => a.date - b.date);
                
                // Create cumulative activity for this file
                let cumulativeActivity = {
                    gyro_total: 0,
                    accel_total: 0,
                    rrate_total: 0,
                    button_total: 0,
                    magnitude_total: 0,
                    last_commit: null
                };
                
                commits.forEach(commit => {
                    cumulativeActivity.gyro_total += commit.gyro_changes;
                    cumulativeActivity.accel_total += commit.accel_changes;
                    cumulativeActivity.rrate_total += commit.rrate_changes;
                    cumulativeActivity.button_total += commit.button_changes;
                    cumulativeActivity.magnitude_total += commit.total_magnitude;
                    cumulativeActivity.last_commit = commit;
                    
                    timeline.push({
                        name: fileName,
                        date: commit.date,
                        complexity: cumulativeActivity.magnitude_total,
                        gyro_refs: cumulativeActivity.gyro_total,
                        accel_refs: cumulativeActivity.accel_total,
                        rrate_refs: cumulativeActivity.rrate_total,
                        button_refs: cumulativeActivity.button_total,
                        category: determineFileCategory(cumulativeActivity),
                        hash: commit.hash,
                        author: commit.author,
                        message: commit.message,
                        file_size: fileName.length * 100 // Approximate
                    });
                });
            });
            
            allFiles = timeline.sort((a, b) => a.date - b.date);
            
            // Set date range
            if (allFiles.length > 0) {
                minDate = new Date(Math.min(...allFiles.map(f => f.date)));
                maxDate = new Date(Math.max(...allFiles.map(f => f.date)));
                currentDate = maxDate;
            }
            
            console.log(`Processed ${allFiles.length} file timeline entries`);
            console.log('Date range:', minDate, 'to', maxDate);
        }
        
        function determineFileCategory(activity) {
            const types = [];
            if (activity.gyro_total > 0) types.push('gyro');
            if (activity.accel_total > 0) types.push('accel');
            if (activity.rrate_total > 0) types.push('rrate');
            if (activity.button_total > 0) types.push('button');
            
            if (types.length === 0) return 'none';
            if (types.length === 1) return types[0];
            return 'mixed';
        }

        function setupFilters() {
            const filterContainer = document.getElementById('category-filters');
            const categories = ['gyro', 'accel', 'rrate', 'button', 'mixed'];
            
            categories.forEach(category => {
                const count = allFiles.filter(f => f.category === category).length;
                
                const filter = document.createElement('div');
                filter.className = `category-filter ${count > 0 ? 'active' : 'disabled'}`;
                filter.dataset.category = category;
                
                filter.innerHTML = `
                    <div class="filter-color" style="background-color: ${colors[category]}"></div>
                    <span>${category} (${count})</span>
                `;
                
                if (count > 0) {
                    filter.addEventListener('click', () => toggleFilter(category, filter));
                }
                
                filterContainer.appendChild(filter);
            });
        }

        function setupControls() {
            // Timeline slider
            const slider = document.getElementById('timeline-slider');
            const startLabel = document.getElementById('start-date');
            const endLabel = document.getElementById('end-date');
            const currentLabel = document.getElementById('current-date');
            
            startLabel.textContent = minDate.toISOString().slice(0, 7);
            endLabel.textContent = maxDate.toISOString().slice(0, 7);
            
            slider.addEventListener('input', (e) => {
                const progress = e.target.value / 100;
                const timeDiff = maxDate - minDate;
                currentDate = new Date(minDate.getTime() + timeDiff * progress);
                currentLabel.textContent = currentDate.toISOString().slice(0, 7);
                updateFilteredData();
                updateVisualization();
            });
            
            // View controls
            document.querySelectorAll('.view-button').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.view-button').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    currentView = e.target.dataset.view;
                    updateVisualization();
                });
            });
            
            updateFilteredData();
        }

        function toggleFilter(category, element) {
            if (element.classList.contains('disabled')) return;
            
            if (activeFilters.has(category)) {
                activeFilters.delete(category);
                element.classList.remove('active');
            } else {
                activeFilters.add(category);
                element.classList.add('active');
            }
            
            updateFilteredData();
            updateVisualization();
        }

        function updateFilteredData() {
            // Get the latest state of each file up to current date, then filter by category
            const latestFileStates = getCurrentFileStates();
            
            filteredFiles = latestFileStates.filter(file => {
                return activeFilters.has(file.category);
            });
            
            updateStats();
        }

        function updateStats() {
            const stats = {
                total: filteredFiles.length,
                gyro: filteredFiles.filter(f => f.category === 'gyro').length,
                accel: filteredFiles.filter(f => f.category === 'accel').length,
                rrate: filteredFiles.filter(f => f.category === 'rrate').length,
                button: filteredFiles.filter(f => f.category === 'button').length,
                both: filteredFiles.filter(f => f.category === 'mixed').length,
                complexity: filteredFiles.length > 0 ? 
                    (filteredFiles.reduce((sum, f) => sum + f.complexity, 0) / filteredFiles.length).toFixed(1) : 0
            };
            
            document.getElementById('stat-total').textContent = stats.total;
            document.getElementById('stat-gyro').textContent = stats.gyro;
            document.getElementById('stat-accel').textContent = stats.accel;
            document.getElementById('stat-rrate').textContent = stats.rrate;
            document.getElementById('stat-button').textContent = stats.button;
            document.getElementById('stat-both').textContent = stats.both;
            document.getElementById('stat-complexity').textContent = stats.complexity;
        }

        function updateVisualization() {
            const container = d3.select('#chart-container');
            container.selectAll('*').remove();
            
            if (filteredFiles.length === 0) return;
            
            const containerRect = document.getElementById('chart-container').getBoundingClientRect();
            const margin = { top: 20, right: 20, bottom: 20, left: 20 };
            const width = containerRect.width - margin.left - margin.right;
            const height = containerRect.height - margin.top - margin.bottom;
            
            const svg = container.append('svg')
                .attr('width', containerRect.width)
                .attr('height', containerRect.height);
            
            const g = svg.append('g')
                .attr('transform', `translate(${margin.left},${margin.top})`);
            
            if (currentView === 'bubbles') {
                drawBubbleChart(g, width, height);
            } else if (currentView === 'timeline') {
                drawTimelineChart(g, width, height);
            } else if (currentView === 'complexity') {
                drawComplexityChart(g, width, height);
            }
        }

        function drawBubbleChart(g, width, height) {
            // Get current files (only show files that have activity up to current date)
            const currentFiles = getCurrentFileStates();
            
            if (currentFiles.length === 0) return;
            
            // Use force simulation to position file bubbles
            const simulation = d3.forceSimulation(currentFiles)
                .force('charge', d3.forceManyBody().strength(-100))
                .force('center', d3.forceCenter(width / 2, height / 2))
                .force('collision', d3.forceCollide().radius(d => Math.sqrt(d.complexity) * 4 + 15))
                .stop();
            
            // Run simulation
            for (let i = 0; i < 400; ++i) simulation.tick();
            
            // Draw file bubbles
            const fileBubbles = g.selectAll('.file-bubble')
                .data(currentFiles)
                .enter().append('g')
                .attr('class', 'file-bubble')
                .attr('transform', d => `translate(${d.x},${d.y})`);
            
            fileBubbles.each(function(d) {
                const group = d3.select(this);
                const mainRadius = Math.sqrt(d.complexity) * 4 + 10;
                
                // Main file bubble (background)
                group.append('circle')
                    .attr('class', 'file-main-bubble')
                    .attr('r', mainRadius)
                    .attr('fill', '#2a2a2a')
                    .attr('stroke', '#4CAF50')
                    .attr('stroke-width', 2)
                    .attr('opacity', 0.8);
                
                // File name label
                group.append('text')
                    .attr('class', 'file-name-label')
                    .attr('text-anchor', 'middle')
                    .attr('dy', mainRadius + 15)
                    .attr('font-size', '9px')
                    .attr('fill', '#e0e0e0')
                    .attr('font-weight', 'bold')
                    .text(d.name);
                
                // Create nested bubbles for each IMU type
                const imuData = [];
                if (d.gyro_refs > 0) imuData.push({ type: 'gyro', count: d.gyro_refs, color: colors.gyro });
                if (d.accel_refs > 0) imuData.push({ type: 'accel', count: d.accel_refs, color: colors.accel });
                if (d.rrate_refs > 0) imuData.push({ type: 'rrate', count: d.rrate_refs, color: colors.rrate });
                if (d.button_refs > 0) imuData.push({ type: 'button', count: d.button_refs, color: colors.button });
                
                if (imuData.length > 0) {
                    // Use pack layout for nested bubbles
                    const pack = d3.pack()
                        .size([mainRadius * 1.6, mainRadius * 1.6])
                        .padding(2);
                    
                    const root = d3.hierarchy({ children: imuData })
                        .sum(d => Math.max(3, d.count));
                    
                    pack(root);
                    
                    // Draw IMU type bubbles
                    const imuBubbles = group.selectAll('.imu-bubble')
                        .data(root.leaves())
                        .enter().append('g')
                        .attr('class', 'imu-bubble')
                        .attr('transform', d => `translate(${d.x - mainRadius * 0.8}, ${d.y - mainRadius * 0.8})`);
                    
                    imuBubbles.append('circle')
                        .attr('r', d => d.r)
                        .attr('fill', d => d.data.color)
                        .attr('stroke', '#fff')
                        .attr('stroke-width', 1)
                        .attr('opacity', 0.9);
                    
                    // Add IMU type labels for larger bubbles
                    imuBubbles.append('text')
                        .attr('text-anchor', 'middle')
                        .attr('dy', '0.35em')
                        .attr('font-size', d => Math.min(8, d.r / 2))
                        .attr('fill', '#fff')
                        .attr('font-weight', 'bold')
                        .style('pointer-events', 'none')
                        .text(d => d.r > 8 ? d.data.type : d.data.count);
                }
                
                // Add activity indicator (pulse animation for recent activity)
                const daysSinceLastActivity = (currentDate - d.date) / (1000 * 60 * 60 * 24);
                if (daysSinceLastActivity < 30) {
                    group.append('circle')
                        .attr('class', 'activity-pulse')
                        .attr('r', mainRadius + 3)
                        .attr('fill', 'none')
                        .attr('stroke', '#4CAF50')
                        .attr('stroke-width', 2)
                        .attr('opacity', 0.6)
                        .style('animation', `pulse 2s infinite`);
                }
            });
            
            // Add mouse events
            fileBubbles
                .on('mouseover', function(event, d) {
                    d3.select(this)
                        .select('.file-main-bubble')
                        .transition()
                        .duration(200)
                        .attr('stroke-width', 4)
                        .attr('stroke', '#ffffff');
                    showTooltip(event, d);
                })
                .on('mouseout', function(event, d) {
                    d3.select(this)
                        .select('.file-main-bubble')
                        .transition()
                        .duration(200)
                        .attr('stroke-width', 2)
                        .attr('stroke', '#4CAF50');
                    hideTooltip();
                })
                .on('click', (event, d) => {
                    console.log('Clicked file:', d.name, 'Latest commit:', d.hash);
                });
        }
        
        function getCurrentFileStates() {
            // Get the latest state of each file up to the current date
            const fileStates = new Map();
            
            allFiles.forEach(entry => {
                if (entry.date <= currentDate) {
                    // Only keep the latest entry for each file
                    const existing = fileStates.get(entry.name);
                    if (!existing || entry.date > existing.date) {
                        fileStates.set(entry.name, entry);
                    }
                }
            });
            
            return Array.from(fileStates.values());
        }

        function drawTimelineChart(g, width, height) {
            const xScale = d3.scaleTime()
                .domain(d3.extent(filteredFiles, d => d.date))
                .range([0, width]);
            
            const yScale = d3.scaleBand()
                .domain(filteredFiles.map(f => f.name))
                .range([0, height])
                .padding(0.1);
            
            // Draw timeline bars
            g.selectAll('.timeline-bar')
                .data(filteredFiles)
                .enter().append('rect')
                .attr('class', 'timeline-bar')
                .attr('x', d => xScale(d.date))
                .attr('y', d => yScale(d.name))
                .attr('width', d => Math.max(2, d.complexity))
                .attr('height', yScale.bandwidth())
                .attr('fill', d => colors[d.category])
                .attr('opacity', 0.8)
                .on('mouseover', showTooltip)
                .on('mouseout', hideTooltip);
            
            // Add x-axis
            g.append('g')
                .attr('transform', `translate(0,${height})`)
                .call(d3.axisBottom(xScale).tickFormat(d3.timeFormat("%Y-%m")))
                .selectAll('text')
                .style('fill', '#888');
        }

        function drawComplexityChart(g, width, height) {
            const xScale = d3.scaleLinear()
                .domain([0, d3.max(filteredFiles, d => d.complexity) || 1])
                .range([0, width]);
            
            const yScale = d3.scaleBand()
                .domain(filteredFiles.sort((a, b) => b.complexity - a.complexity).map(f => f.name))
                .range([0, height])
                .padding(0.1);
            
            // Draw complexity bars
            g.selectAll('.complexity-bar')
                .data(filteredFiles)
                .enter().append('rect')
                .attr('class', 'complexity-bar')
                .attr('x', 0)
                .attr('y', d => yScale(d.name))
                .attr('width', d => xScale(d.complexity))
                .attr('height', yScale.bandwidth())
                .attr('fill', d => colors[d.category])
                .attr('opacity', 0.8)
                .on('mouseover', showTooltip)
                .on('mouseout', hideTooltip);
            
            // Add file labels
            g.selectAll('.file-label')
                .data(filteredFiles)
                .enter().append('text')
                .attr('class', 'file-label')
                .attr('x', -5)
                .attr('y', d => yScale(d.name) + yScale.bandwidth() / 2)
                .attr('dy', '0.35em')
                .style('text-anchor', 'end')
                .style('font-size', '10px')
                .style('fill', '#888')
                .text(d => d.name);
        }

        function showTooltip(event, d) {
            const tooltip = d3.select('#tooltip');
            const file = d.data || d;
            
            const content = `
                <strong>File:</strong> ${file.name}<br>
                <strong>Latest Commit:</strong> ${file.hash}<br>
                <strong>Author:</strong> ${file.author}<br>
                <strong>Message:</strong> ${file.message}<br>
                <strong>Total Magnitude:</strong> ${file.complexity.toFixed(1)}<br>
                <strong>Gyro changes:</strong> ${file.gyro_refs}<br>
                <strong>Accel changes:</strong> ${file.accel_refs}<br>
                <strong>RRate changes:</strong> ${file.rrate_refs}<br>
                <strong>Button changes:</strong> ${file.button_refs}<br>
                <strong>Last Modified:</strong> ${file.date.toISOString().slice(0, 10)}
            `;
            
            tooltip
                .style('display', 'block')
                .html(content)
                .style('left', (event.pageX + 10) + 'px')
                .style('top', (event.pageY - 10) + 'px');
        }

        function hideTooltip() {
            d3.select('#tooltip').style('display', 'none');
        }

        // Initialize
        window.addEventListener('load', loadData);
    </script>
</body>
</html>
